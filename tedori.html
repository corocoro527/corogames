<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手取り・残業代 一発計算シミュレーター</title>
  <meta name="description" content="額面給与や残業時間から、ざっくりとした手取り額や残業代を簡単一発計算！">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; color: #334155; margin: 0; padding: 20px 12px; }
    .container { max-width: 450px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { font-size: 1.3rem; text-align: center; color: #1e293b; margin-bottom: 6px; }
    p.sub { font-size: 0.8rem; text-align: center; color: #64748b; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 4px; }
    input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
    input:focus { border-color: #2563eb; outline: none; }
    button { width: 100%; padding: 14px; background: #2563eb; color: #fff; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    button:active { background: #1d4ed8; }
    .result { margin-top: 20px; padding: 16px; background: #f1f5f9; border-radius: 8px; display: none; }
    .result-item { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px; }
    .result-item.total { border-top: 1px solid #cbd5e1; padding-top: 8px; font-weight: bold; font-size: 1.1rem; color: #1e293b; }
    .result-item.net { color: #16a34a; font-size: 1.2rem; font-weight: bold; border-top: 2px solid #16a34a; padding-top: 8px; margin-top: 8px; }
    .back-btn { display: block; text-align: center; margin-top: 16px; font-size: 0.85rem; color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>手取り・残業代 計算ツール</h1>
  <p class="sub">基本給と残業時間を入れるだけで一発計算！</p>

  <div class="form-group">
    <label for="baseSalary">基本給（月額 / 円）</label>
    <input type="number" id="baseSalary" placeholder="例: 250000" inputmode="numeric">
  </div>

  <div class="form-group">
    <label for="overtimeHours">今月の残業時間（時間）</label>
    <input type="number" id="overtimeHours" placeholder="例: 20" inputmode="numeric">
  </div>

  <div class="form-group">
    <label for="workDays">月間所定労働日数（日）</label>
    <input type="number" id="workDays" value="20" inputmode="numeric">
  </div>

  <button onclick="calculate()">計算する</button>

  <div class="result" id="resultArea">
    <div class="result-item">
      <span>推定時給:</span>
      <span id="hourlyRate">0 円</span>
    </div>
    <div class="result-item">
      <span>残業代（1.25倍割増）:</span>
      <span id="overtimePay">0 円</span>
    </div>
    <div class="result-item total">
      <span>総支給額（額面）:</span>
      <span id="grossPay">0 円</span>
    </div>
    <div class="result-item">
      <span>概算控除額（税金・保険料 約20%）:</span>
      <span id="deduction">-0 円</span>
    </div>
    <div class="result-item net">
      <span>推定手取り額:</span>
      <span id="netPay">0 円</span>
    </div>
  </div>

  <a href="index.html" class="back-btn">← トップページに戻る</a>
</div>

<script>
function calculate() {
  const baseSalary = parseFloat(document.getElementById('baseSalary').value) || 0;
  const overtimeHours = parseFloat(document.getElementById('overtimeHours').value) || 0;
  const workDays = parseFloat(document.getElementById('workDays').value) || 20;

  if (baseSalary <= 0) {
    alert('基本給を入力してください。');
    return;
  }

  // 1日8時間労働として計算
  const hourlyRate = baseSalary / (workDays * 8);
  const overtimePay = hourlyRate * 1.25 * overtimeHours;
  const grossPay = baseSalary + overtimePay;
  
  // 概算控除（約20%想定）
  const deduction = grossPay * 0.20;
  const netPay = grossPay - deduction;

  document.getElementById('hourlyRate').innerText = Math.round(hourlyRate).toLocaleString() + ' 円';
  document.getElementById('overtimePay').innerText = Math.round(overtimePay).toLocaleString() + ' 円';
  document.getElementById('grossPay').innerText = Math.round(grossPay).toLocaleString() + ' 円';
  document.getElementById('deduction').innerText = '-' + Math.round(deduction).toLocaleString() + ' 円';
  document.getElementById('netPay').innerText = Math.round(netPay).toLocaleString() + ' 円';

  document.getElementById('resultArea').style.display = 'block';
}
</script>

</body>
</html>
