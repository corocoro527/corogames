<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>裏・16コア性格診断 - あなたの真の毒舌性格を暴露</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px 12px; }
    .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    h1 { font-size: 1.4rem; text-align: center; color: #ef4444; margin-bottom: 8px; }
    p.sub { font-size: 0.85rem; text-align: center; color: #94a3b8; margin-bottom: 20px; }
    .q-card { background: #0f172a; padding: 14px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #334155; }
    .q-title { font-size: 0.95rem; font-weight: bold; margin-bottom: 10px; color: #38bdf8; }
    .btn-option { width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 8px; background: #1e293b; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
    .btn-option.selected { background: #ef4444; border-color: #f87171; color: white; font-weight: bold; }
    .submit-btn { width: 100%; padding: 14px; background: #ef4444; color: white; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    .result { display: none; margin-top: 20px; padding: 16px; background: #0f172a; border-radius: 8px; border: 1px solid #ef4444; }
    .result-type { font-size: 1.3rem; font-weight: bold; color: #ef4444; margin-bottom: 8px; text-align: center; }
    .result-desc { font-size: 0.9rem; line-height: 1.6; color: #cbd5e1; }
    .back-btn { display: block; text-align: center; margin-top: 16px; font-size: 0.85rem; color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>🔥 裏・16コア性格診断</h1>
  <p class="sub">全20问であなたの真の毒舌性格を徹底解剖！</p>

  <div id="quizArea"></div>

  <button class="submit-btn" onclick="diagnose()">裏の顔を判定する</button>

  <div class="result" id="resultArea">
    <div class="result-type" id="resultType"></div>
    <div class="result-desc" id="resultDesc"></div>
  </div>

  <a href="index.html" class="back-btn">← トップページに戻る</a>
</div>

<script>
const questions = [
  { q: "1. 休日の理想的な過ごし方は？", a: [{t:"E", val:0, text:"友達と外に出てワイワイ遊ぶ"}, {t:"E", val:1, text:"家で1人で趣味に没頭する"}] },
  { q: "2. 初対面の人だらけの集まりに行ったら？", a: [{t:"E", val:0, text:"自分から積極的に声をかける"}, {t:"E", val:1, text:"壁の花になって話しかけられるのを待つ"}] },
  { q: "3. 悩みを相談された時、真っ先に考えることは？", a: [{t:"T", val:1, text:"具体的にどう解決すべきかの正論"}, {t:"T", val:0, text:"相手の気持ちに共感して慰めること"}] },
  { q: "4. 友達が明らかに間違ったことを言っていたら？", a: [{t:"T", val:1, text:"「それは違うで」とその場で指摘する"}, {t:"T", val:0, text:"雰囲気を壊さないようにあえて流す"}] },
  { q: "5. 旅行に行くとき、スケジュールはどう立てる？", a: [{t:"J", val:0, text:"分単位でしっかり計画を立てて移動する"}, {t:"J", val:1, text:"行き当たりばったりでその場のノリで決める"}] },
  { q: "6. 部屋の散らかり具合や書類の整理は？", a: [{t:"J", val:0, text:"常にキレイに整頓されている"}, {t:"J", val:1, text:"足の踏み場がなくなるまで放置しがち"}] },
  { q: "7. 物事を考えるときに重視するのは？", a: [{t:"S", val:0, text:"現実的なデータや過去の実績"}, {t:"S", val:1, text:"自分の直感や「こうなったら面白そう」という可能性"}] },
  { q: "8. 映画やアニメを見ている時の感覚は？", a: [{t:"S", val:0, text:"ストーリーの辻褄や設定の矛盾が気になる"}, {t:"S", val:1, text:"世界観やキャラクターの感情に深く感情移入する"}] },
  { q: "9. チーム作業で意見が分かれたときは？", a: [{t:"T", val:1, text:"感情を抜きにして一番効率的な案を推す"}, {t:"T", val:0, text:"全員が納得できる丸く収まる着地点を探す"}] },
  { q: "10. 予定していた約束が急にキャンセルになったら？", a: [{t:"J", val:1, text:"「ラッキー！自由時間増えた！」と喜ぶ"}, {t:"J", val:0, text:"計画が狂って少しイラッとする"}] },
  { q: "11. 周囲から「変わってるね」と言われたら？", a: [{t:"S", val:1, text:"心の中で「褒め言葉だな」とニヤリとする"}, {t:"S", val:0, text:"「え、浮いてるかな…」と少し心配になる"}] },
  { q: "12. 大人数での発言や発表の場面では？", a: [{t:"E", val:0, text:"目立つチャンス！と平気で喋れる"}, {t:"E", val:1, text:"心臓バクバクで一刻も早く終わらせたい"}] },
  { q: "13. LINEの返信ペースは？", a: [{t:"E", val:0, text:"気づいたらすぐ返すテンポ早め"}, {t:"E", val:1, text:"既読をつけても気分が乗るまで放置しがち"}] },
  { q: "14. 新しい家電やアプリを使うときは？", a: [{t:"S", val:0, text:"取扱説明書やガイドを読んでから使う"}, {t:"S", val:1, text:"説明書は見ずに適当に触りながら覚える"}] },
  { q: "15. 人から理不尽に怒られたらどうする？", a: [{t:"T", val:1, text:"相手の論理の破綻を徹底的に詰め返す"}, {t:"T", val:0, text:"ショックを受けてその場では何も言えなくなる"}] },
  { q: "16. 締め切りや期限に対する姿勢は？", a: [{t:"J", val:0, text:"余裕をもって数日前には終わらせる"}, {t:"J", val:1, text:"締め切り直前のギリギリにならないと本気が出ない"}] },
  { q: "17. 人混みや賑やかな街に出かけた後は？", a: [{t:"E", val:0, text:"楽しかった！と充実感に満たされる"}, {t:"E", val:1, text:"HPがゼロになってぐったり疲れる"}] },
  { q: "18. 「抽象的な哲学の話」や「宇宙の謎」の話は？", a: [{t:"S", val:1, text:"想像が膨らんでワクワクしてずっと話せる"}, {t:"S", val:0, text:"「で、それが何の役に立つの？」と思ってしまう"}] },
  { q: "19. 判断に迷ったとき、最終的な決め手は？", a: [{t:"T", val:1, text:"損得勘定や合理的なメリット"}, {t:"T", val:0, text:"自分や周りの人が納得・感動できるか"}] },
  { q: "20. 突発的なトラブルが起きたときは？", a: [{t:"J", val:1, text:"アドレナリンが出てその場の臨機応変で対処する"}, {t:"J", val:0, text:"「想定外だ…」とパニックになりかける"}] }
];

let answers = {};

function renderQuiz() {
  const area = document.getElementById('quizArea');
  let html = '';
  questions.forEach((q, idx) => {
    html += `<div class="q-card">
      <div class="q-title">${q.q}</div>
      <button class="btn-option" id="btn_${idx}_0" onclick="selectOpt(${idx}, 0, '${q.a[0].t}', ${q.a[0].val})">${q.a[0].text}</button>
      <button class="btn-option" id="btn_${idx}_1" onclick="selectOpt(${idx}, 1, '${q.a[1].t}', ${q.a[1].val})">${q.a[1].text}</button>
    </div>`;
  });
  area.innerHTML = html;
}

function selectOpt(qIdx, optIdx, type, val) {
  answers[qIdx] = { type, val };
  document.getElementById(`btn_${qIdx}_0`).classList.remove('selected');
  document.getElementById(`btn_${qIdx}_1`).classList.remove('selected');
  document.getElementById(`btn_${qIdx}_${optIdx}`).classList.add('selected');
}

function diagnose() {
  if (Object.keys(answers).length < questions.length) {
    alert('すべての質問に答えてな！（あと ' + (questions.length - Object.keys(answers).length) + ' 問）');
    return;
  }

  let score = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
  Object.values(answers).forEach(a => {
    if (a.type === 'E') a.val === 0 ? score.E++ : score.I++;
    if (a.type === 'S') a.val === 0 ? score.S++ : score.N++;
    if (a.type === 'T') a.val === 1 ? score.T++ : score.F++;
    if (a.type === 'J') a.val === 0 ? score.J++ : score.P++;
  });

  const type = (score.I >= score.E ? 'I':'E') + (score.N >= score.S ? 'N':'S') + (score.F >= score.T ? 'F':'T') + (score.P >= score.J ? 'P':'J');

  const results = {
    "INTP": { name: "冷酷な理屈屋マシーン", desc: "感情ゼロの論理モンスター。他人の感情論に反論するのが快感。引きこもり予備軍。" },
    "INTJ": { name: "孤高のドS黒幕参謀", desc: "上から目線で人間を観察する冷血漢。計画通りにいかないと内心ブチギレ。" },
    "INFP": { name: "ガラスのハートメンヘラ", desc: "被害妄想のプロ。自分の世界に閉じこもり、勝手に傷ついて勝手に病む。" },
    "INFJ": { name: "腹黒おせっかい偽善者", desc: "笑顔の裏で人を査定。一見優しいが限界を超えると一瞬で人間関係を断絶する。" },
    "ISTP": { name: "単独行動サイコパス", desc: "興味のない話は1秒も聞いてない。群れる奴らを「群れなきゃ生きてけない弱者」と見下す。" },
    "ISTJ": { name: "頭の硬いロボット公務員", desc: "マニュアル通りしか動けない頭カチカチ人間。融通が効かない変化嫌い。" },
    "ISFP": { name: "キャパ狭お気楽なまけもの", desc: "現実逃避の天才。ストレスを感じるとすぐ脳死状態になり、後回しにして詰む。" },
    "ISFJ": { name: "自己犠牲アピール妖怪", desc: "「私ばっかり損してる」が裏の口癖。断れない弱さを「優しさ」だと勘違い。" },
    "ENTP": { name: "レスバ中毒ひろゆきキッズ", desc: "相手を論破してニヤニヤするのが生きがい。口だけで実行力ゼロ。" },
    "ENTJ": { name: "独裁者ワンプッシュ暴君", desc: "他人は自分の駒。成果が出ない奴は人権なしだと思っている超絶クラッシャー。" },
    "ENFP": { name: "多動気質のかまってちゃん", desc: "アイディアは出すが飽き性で投げ出す。キャピキャピしてるが内面スカスカ。" },
    "ENFJ": { name: "教祖様ごっこ洗脳野郎", desc: "「みんなで仲良く！」を強要する平和主義の押し売り。裏で逆らう奴を排除。" },
    "ESTP": { name: "イキリパリピ直感バカ", desc: "スリルとノリだけで生きてる。後先考えずに突っ込んで周りを巻き込んで爆死する。" },
    "ESTJ": { name: "老害予備軍説教ババア/ジジイ", desc: "「普通はさぁ」が口癖の老害予備軍。自分の価値観こそが正義だと信じて疑わない。" },
    "ESFP": { name: "目立ちたがり露出狂", desc: "チヤホヤされないと死ぬマグロ。ノリは良いが深い話は何もできない。" },
    "ESFJ": { name: "同調圧力の女王", desc: "陰口と噂話が大好物。「みんな言ってるよ」を武器に他人を叩く警察官。" }
  };

  const res = results[type] || { name: "謎の毒舌人間", desc: "計測不能の怪人物やで。" };

  document.getElementById('resultType').innerText = `${type} : ${res.name}`;
  document.getElementById('resultDesc').innerText = res.desc;
  document.getElementById('resultArea').style.display = 'block';
}

renderQuiz();
</script>

</body>
</html>
