let currentPage = 0;
const questionsPerPage = 7;
let userAnswers = {};

function renderQuestions() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';
  
  const start = currentPage * questionsPerPage;
  const end = Math.min(start + questionsPerPage, questions.length);

  for (let i = start; i < end; i++) {
    const qData = questions[i];
    const card = document.createElement('div');
    card.className = 'question-card';
    
    let html = `<div class="question-title">Q${i + 1}. ${qData.q}</div><div class="options">`;
    
    qData.options.forEach((opt, optIdx) => {
      const isSelected = userAnswers[i] === optIdx ? 'selected' : '';
      html += `<button class="option-btn ${isSelected}" onclick="selectOption(${i}, ${optIdx})">${opt.text}</button>`;
    });

    html += `</div>`;
    card.innerHTML = html;
    container.appendChild(card);
  }

  updateProgress();
  updateButtons();
}

function selectOption(questionIndex, optionIndex) {
  userAnswers[questionIndex] = optionIndex;
  renderQuestions();
}

function updateProgress() {
  const answeredCount = Object.keys(userAnswers).length;
  const progressPercent = (answeredCount / questions.length) * 100;
  document.getElementById('progress-bar').style.width = `${progressPercent}%`;
}

function updateButtons() {
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');

  prevBtn.style.display = currentPage === 0 ? 'none' : 'block';

  const start = currentPage * questionsPerPage;
  const end = Math.min(start + questionsPerPage, questions.length);
  
  let pageComplete = true;
  for (let i = start; i < end; i++) {
    if (userAnswers[i] === undefined) {
      pageComplete = false;
      break;
    }
  }

  nextBtn.disabled = !pageComplete;
  
  if (currentPage === Math.ceil(questions.length / questionsPerPage) - 1) {
    nextBtn.innerText = '診断結果を見る';
  } else {
    nextBtn.innerText = '次へ';
  }
}

function nextPage() {
  const totalPages = Math.ceil(questions.length / questionsPerPage);
  if (currentPage < totalPages - 1) {
    currentPage++;
    renderQuestions();
    window.scrollTo(0, 0);
  } else {
    calculateResult();
  }
}

function prevPage() {
  if (currentPage > 0) {
    currentPage--;
    renderQuestions();
    window.scrollTo(0, 0);
  }
}

function calculateResult() {
  let scores = { E: 0, I: 0, N: 0, S: 0, T: 0, F: 0, J: 0, P: 0 };

  Object.keys(userAnswers).forEach(qIdx => {
    const optIdx = userAnswers[qIdx];
    const scoreObj = questions[qIdx].options[optIdx].score;
    for (let key in scoreObj) {
      scores[key] += scoreObj[key];
    }
  });

  const type = [
    scores.E >= scores.I ? 'E' : 'I',
    scores.N >= scores.S ? 'N' : 'S',
    scores.T >= scores.F ? 'T' : 'F',
    scores.J >= scores.P ? 'J' : 'P'
  ].join('');

  showResult(type);
}

function showResult(type) {
  document.getElementById('quiz-page').style.display = 'none';
  const resultPage = document.getElementById('result-page');
  resultPage.style.display = 'block';

  const res = results[type];
  const badge = document.getElementById('type-badge');

  document.getElementById('type-title').innerText = res.title;
  document.getElementById('type-code').innerText = type;
  document.getElementById('type-desc').innerText = res.desc;
  document.getElementById('type-flaw').innerText = res.flaw;

  // グループごとの色設定
  if (res.group === 'NT') { badge.style.backgroundColor = 'var(--nt-color)'; badge.style.color = '#fff'; }
  else if (res.group === 'NF') { badge.style.backgroundColor = 'var(--nf-color)'; badge.style.color = '#fff'; }
  else if (res.group === 'SJ') { badge.style.backgroundColor = 'var(--sj-color)'; badge.style.color = '#fff'; }
  else if (res.group === 'SP') { badge.style.backgroundColor = 'var(--sp-color)'; badge.style.color = '#000'; }

  // ステータスバー生成
  const statusContainer = document.getElementById('status-bars');
  statusContainer.innerHTML = '';
  for (let key in res.status) {
    const val = res.status[key];
    statusContainer.innerHTML += `
      <div class="status-bar-container">
        <div class="status-label"><span>${key}</span><span>${val}%</span></div>
        <div class="status-bar-bg"><div class="status-bar-fill" style="width: ${val}%"></div></div>
      </div>
    `;
  }

  // トリセツ生成
  const manualList = document.getElementById('type-manual');
  manualList.innerHTML = '';
  res.manual.forEach(item => {
    manualList.innerHTML += `<li>${item}</li>`;
  });

  window.scrollTo(0, 0);
}

function shareX() {
  const typeCode = document.getElementById('type-code').innerText;
  const typeTitle = document.getElementById('type-title').innerText;
  const text = encodeURIComponent(`私の裏性格は【${typeCode}: ${typeTitle}】でした…💀\n\nあなたの隠された毒舌な本性も暴いてみない？\n#裏16コア性格診断 #性格診断 #16Personalities\n`);
  const url = encodeURIComponent(window.location.href);
  window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
}

// 初期化
renderQuestions();
</script>
