<a class="brand" href="../">KOROPOP LABS<small>INTERACTIVE DEMO</small></a><a class="back" href="../solutions/auto.html">← 中古車向けプランへ戻る</a>
<span class="badge">デモ・入力内容は送信されません</span><h1>車両情報を一度入れて、<br>3媒体の文章へ。</h1>
<p class="lead">同じ車両情報を何度も書き直す手間を減らすイメージです。実導入では店舗の表現ルールや禁止表現に合わせて調整します。</p>
<div class="card"><div class="grid2">
<div><div class="field"><label>車種</label><input id="car" value="トヨタ プリウス"></div><div class="field"><label>年式</label><input id="year" value="2021年"></div><div class="field"><label>走行距離</label><input id="km" value="32,000km"></div></div>
<div><div class="field"><label>価格</label><input id="price" value="198万円"></div><div class="field"><label>主な装備・特徴</label><textarea id="feat">純正ナビ、バックカメラ、ETC、禁煙車、車検2028年3月まで</textarea></div></div>
</div><button class="btn" id="run">文章を作る</button></div>
<div class="grid2"><div class="card"><div class="label">自社サイト向け</div><div class="out" id="siteOut"></div><div class="label">Instagram / SNS向け</div><div class="out" id="snsOut"></div></div>
<div class="card"><div class="label">Google向け短文</div><div class="out" id="gOut"></div><div class="label">スタッフ確認ポイント</div><div class="out" id="cOut"></div></div></div>
<div class="notice">価格・装備・修復歴・保証等は必ず元データと照合し、スタッフが最終確認する前提です。</div>
<div class="cta"><h2>店舗の文章ルールに合わせて固定できます。</h2><p>媒体ごとの長さや文体も調整可能です。</p><a class="btn" href="../contact.html">30分の無料相談へ</a></div>
</main><script>
function v(id){return document.getElementById(id).value.trim()}
function run(){const car=v('car'),year=v('year'),km=v('km'),price=v('price'),feat=v('feat');
document.getElementById('siteOut').textContent=car+"（"+year+"）入庫しました。走行距離は"+km+"、車両価格は"+price+"です。\n\n主な装備・特徴：\n"+feat+"\n\n気になる点がございましたら、お気軽にお問い合わせください。※掲載内容はスタッフ確認後に公開します。";
document.getElementById('snsOut').textContent="【入庫情報】"+car+" 🚗\n"+year+" / "+km+" / "+price+"\n"+feat+"\n\n詳細は店舗までお問い合わせください。\n#中古車 #入庫情報";
document.getElementById('gOut').textContent=car+"が入庫しました。"+year+"、走行"+km+"、"+price+"。"+feat+"。詳細はお気軽にお問い合わせください。";
document.getElementById('cOut').textContent="・車両価格の一致\n・走行距離の一致\n・装備の有無\n・修復歴/保証/諸費用の表記\n・各媒体の掲載ルール";
}
document.getElementById('run').onclick=run;run();
</script></body></html>
