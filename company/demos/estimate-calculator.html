<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>概算見積シミュレーター デモ｜KOROPOP LABS</title><style>
:root{--bg:#07111f;--panel:#0d1a2b;--line:#20334d;--text:#eef5ff;--muted:#9fb0c6;--accent:#68e1fd;--accent2:#8f7cff;--good:#9ff3c8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06101e,#091522);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.75}
a{color:inherit;text-decoration:none}.wrap{width:min(1020px,calc(100% - 28px));margin:auto;padding:44px 0 70px}.brand{font-weight:900;letter-spacing:.08em}.brand small{display:block;color:#8297b0;font-size:10px;letter-spacing:.18em}.badge{display:inline-block;margin-top:20px;padding:6px 10px;border:1px solid #315170;border-radius:999px;color:#bdefff;font-size:12px}
h1{font-size:clamp(36px,6vw,62px);line-height:1.1;letter-spacing:-.035em;margin:18px 0 16px}.lead{font-size:18px;color:#bdccdc;max-width:840px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:linear-gradient(180deg,#0f1d30,#0b1727);border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:16px}.card p{color:var(--muted)}.price{font-size:38px;font-weight:950}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#10283b;color:#83e8ff;font-size:12px;font-weight:900}.btn{display:inline-block;margin-top:10px;padding:13px 18px;border-radius:999px;background:linear-gradient(135deg,var(--accent),#8fb4ff,var(--accent2));color:#06101e;font-weight:900}.ghost{background:transparent;color:#fff;border:1px solid var(--line)}.cta{margin-top:24px;padding:28px;border-radius:22px;background:linear-gradient(135deg,#dffaff,#d7e6ff,#ded8ff);color:#07111f}.cta p{color:#30445c}.cta .btn{background:#07111f;color:#fff}.small{font-size:12px;color:#7f93aa}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:13px;color:#bdd0e1}.field select,.field input{width:100%;padding:12px 14px;border-radius:12px;background:#071524;border:1px solid #29425f;color:#fff;font:inherit}.result{font-size:34px;font-weight:950;color:var(--good);margin-top:8px}.muted{color:var(--muted)}@media(max-width:760px){.grid3{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<div class="brand">KOROPOP LABS<small>LIVE DEMO</small></div><span class="badge">架空のハウスクリーニング料金デモ</span>
<h1>30秒で、概算料金。</h1><p class="lead">実在する会社の料金ではありません。料金ルールをWeb上でどう見せられるかの操作デモです。</p>
<section class="card">
<div class="field"><label>間取り</label><select id="size"><option value="12000">1R / 1K</option><option value="18000">1DK / 1LDK</option><option value="26000">2DK / 2LDK</option><option value="36000">3DK / 3LDK</option></select></div>
<div class="field"><label>水回りセット</label><select id="water"><option value="0">なし</option><option value="5000">2点セット +5,000円</option><option value="9000">3点セット +9,000円</option></select></div>
<div class="field"><label>エアコン</label><select id="air"><option value="0">なし</option><option value="8000">1台 +8,000円</option><option value="16000">2台 +16,000円</option></select></div>
<div class="field"><label>急ぎ対応</label><select id="rush"><option value="1">通常</option><option value="1.2">3日以内の希望</option></select></div>
<button class="btn" id="calc" type="button">概算を計算</button>
<div class="result" id="result">—</div><p class="muted" id="note">正式料金ではありません。</p>
</section>
<section class="card"><h2>この仕組みを御社の料金ルールへ置き換えます</h2><p>価格を出し切れない業種なら、金額ではなく「料金帯」「おすすめプラン」「必要な確認項目」を返す設計にもできます。</p></section>
<section class="cta"><h2>シミュレーター制作 49,800円〜</h2><p>既存サイトへの追加、新規ホームページとのセット、問い合わせ自動記録との連携まで対応範囲を切り分けられます。</p><a class="btn" href="../contact.html?src=estimate-calculator-demo">相談する</a></section>
</main><script>
function calc(){var base=Number(document.getElementById('size').value)+Number(document.getElementById('water').value)+Number(document.getElementById('air').value);var rush=Number(document.getElementById('rush').value);var total=Math.round(base*rush/100)*100;var low=Math.round(total*.9/100)*100;var high=Math.round(total*1.1/100)*100;document.getElementById('result').textContent=low.toLocaleString()+'円〜'+high.toLocaleString()+'円';document.getElementById('note').textContent='概算です。現地状況や作業条件により変わります。';if(window.gtag)gtag('event','estimate_calculator_demo_complete');}document.getElementById('calc').onclick=calc;
</script></body></html>
