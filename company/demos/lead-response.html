<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>問い合わせ即時フォロー デモ｜KOROPOP LABS</title><style>
:root{--bg:#07111f;--panel:#0d1a2b;--line:#20334d;--text:#eef5ff;--muted:#9fb0c6;--accent:#68e1fd;--accent2:#8f7cff;--good:#9ff3c8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06101e,#091522);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.75}
a{color:inherit;text-decoration:none}.wrap{width:min(980px,calc(100% - 28px));margin:auto;padding:44px 0 70px}.brand{font-weight:900;letter-spacing:.08em}.brand small{display:block;color:#8297b0;font-size:10px;letter-spacing:.18em}.badge{display:inline-block;margin-top:20px;padding:6px 10px;border:1px solid #315170;border-radius:999px;color:#bdefff;font-size:12px}
h1{font-size:clamp(36px,6vw,62px);line-height:1.1;letter-spacing:-.035em;margin:18px 0 16px}.lead{font-size:18px;color:#bdccdc;max-width:820px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:linear-gradient(180deg,#0f1d30,#0b1727);border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:16px}.card p{color:var(--muted)}.price{font-size:40px;font-weight:950}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#10283b;color:#83e8ff;font-size:12px;font-weight:900}.btn{display:inline-block;margin-top:10px;padding:13px 18px;border-radius:999px;background:linear-gradient(135deg,var(--accent),#8fb4ff,var(--accent2));color:#06101e;font-weight:900;border:0;cursor:pointer}.ghost{background:transparent;color:#fff;border:1px solid var(--line)}.cta{margin-top:24px;padding:28px;border-radius:22px;background:linear-gradient(135deg,#dffaff,#d7e6ff,#ded8ff);color:#07111f}.cta p{color:#30445c}.cta .btn{background:#07111f;color:#fff}.small{font-size:12px;color:#7f93aa}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.step{background:#0b1727;border:1px solid var(--line);border-radius:16px;padding:18px}.field{display:grid;gap:7px;margin:12px 0}.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #29425f;background:#071524;color:#fff;font:inherit}.output{white-space:pre-wrap;background:#071524;border:1px solid #29425f;border-radius:14px;padding:15px;min-height:90px;color:#dbe9f6}.good{color:var(--good)}@media(max-width:760px){.grid3,.flow{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<div class="brand">KOROPOP LABS<small>LEAD RESPONSE DEMO</small></div><span class="badge">デモ・入力内容は送信されません</span>
<h1>問い合わせが来たら、<br>担当者にはこう届く。</h1><p class="lead">実際の送信は行わず、ブラウザ内だけで受付メール・社内要約・次アクションを生成します。</p>
<section class="card">
<div class="field"><label>お名前</label><input id="name" value="山田 太郎"></div>
<div class="field"><label>相談種別</label><select id="type"><option>見積相談</option><option>来店予約</option><option>サービス質問</option><option>その他</option></select></div>
<div class="field"><label>相談内容</label><textarea id="body">来週中に一度相談したいです。平日の午後が希望です。料金の目安も知りたいです。</textarea></div>
<button class="btn" id="run">処理イメージを見る</button>
</section>
<div class="grid3">
<section class="card"><h3>お客様への受付案</h3><div class="output" id="ack">まだ生成されていません。</div></section>
<section class="card"><h3>社内向け要約</h3><div class="output" id="summary">まだ生成されていません。</div></section>
<section class="card"><h3>対応チェック</h3><div class="output" id="next">まだ生成されていません。</div></section>
</div>
<section class="cta"><h2>この流れを、実際のフォーム1つに入れる。</h2><p>問い合わせ即時フォロー・取りこぼし防止スターター 49,800円〜。既存環境を確認して、必要な範囲だけ実装します。</p><a class="btn" href="../contact.html?src=lead-response-demo">相談する</a></section>
</main><script>
document.getElementById('run').onclick=function(){
 var n=document.getElementById('name').value||'お客様';
 var t=document.getElementById('type').value;
 var b=document.getElementById('body').value.trim();
 document.getElementById('ack').textContent=n+'様\nお問い合わせありがとうございます。'+t+'として受け付けました。内容を確認のうえ、担当者からご連絡します。';
 document.getElementById('summary').textContent='種別：'+t+'\n相談者：'+n+'\n要点：'+(b||'入力なし');
 document.getElementById('next').textContent='□ 担当者を決める\n□ 希望日時を確認する\n□ 料金・条件は担当者が確認して回答する\n□ 対応済みに更新する';
};
</script></body></html>
