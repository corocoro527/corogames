<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef5ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.75}
a{color:#74ddfb}.w{width:min(760px,calc(100% - 28px));margin:48px auto}.back{display:inline-block;margin-bottom:18px;color:#9fb0c6}
h1{font-size:clamp(32px,6vw,52px);line-height:1.15;margin:0 0 14px}.lead{color:#a9bbcf;margin:0 0 28px}
.box{background:#0d1a2b;border:1px solid #20334d;border-radius:22px;padding:28px}

<body>
<main class="w">

<h1>30分の無料相談</h1>

<div class="box">
<div class="notice">月額契約や大規模システム導入を前提にしていません。最初は19,800〜49,800円の固定価格スターター、または無料相談から始められます。<br><br>メールでのご相談：<a href="mailto:koropop.labs@gmail.com">koropop.labs@gmail.com</a></div>
<form action="https://formsubmit.co/koropopgames.support@gmail.com" method="POST">
<input type="hidden" name="_subject" value="【KOROPOP LABS】無料相談">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_next" value="https://koropopgames.com/company/thanks.html">
<input type="hidden" name="_url" value="https://koropopgames.com/company/contact.html">
<input type="hidden" id="source" name="相談流入元" value="direct">
<input type="text" name="_honey" style="display:none">


<label for="plan">ご相談内容</label>
<select id="plan" name="ご希望プラン">
<option value="">まだ決めていない</option>
<option value="1業務だけ自動化 39,800円〜">1業務だけ自動化 39,800円〜</option>
<option value="不動産管理スターター 49,800円〜">不動産管理スターター 49,800円〜</option>
<option value="中古車販売店スターター 49,800円〜">中古車販売店スターター 49,800円〜</option>
<option value="Googleマップ整備 19,800円〜">Googleマップ整備 19,800円〜</option>
<option value="採用ページ・応募導線 29,800円〜">採用ページ・応募導線 29,800円〜</option>
<option value="問い合わせ導線ミニ改善 29,800円〜">問い合わせ導線ミニ改善 29,800円〜</option>
<option value="Web・LP制作">Web・LP制作</option>
<option value="その他">その他</option>
</select>
<p class="help">迷っている場合は「まだ決めていない」で大丈夫です。</p>

<label for="company">会社名・屋号</label>
<input id="company" name="会社名・屋号" autocomplete="organization">

<label for="name">お名前<span class="req">必須</span></label>
<input id="name" name="お名前" autocomplete="name" required>

<label for="email">メールアドレス<span class="req">必須</span></label>
<input id="email" type="email" name="email" autocomplete="email" required>

<label for="industry">業種</label>
<select id="industry" name="業種">
<option value="">選択してください</option>
<option>不動産・賃貸管理</option><option>建設・工務店・リフォーム</option><option>設備・保守</option>
<option>小売・EC</option><option>自動車関連</option><option>士業・コンサル</option><option>飲食・サービス</option><option>その他</option>
</select>

<label for="url">WebサイトURL</label>
<input id="url" type="url" name="WebサイトURL" placeholder="https://">

<label for="issue">今いちばん面倒な仕事・改善したいこと<span class="req">必須</span></label>
<textarea id="issue" name="困りごと" required placeholder="例：問い合わせ返信に毎日1時間かかる、Excel集計が手作業、ホームページを直す人がいない 等"></textarea>

<label for="budget">ご予算のイメージ</label>
<select id="budget" name="予算感">
<option value="">まだ決めていない</option><option>〜5万円</option><option>5〜10万円</option><option>10〜30万円</option><option>30万円〜</option><option>継続支援も検討したい</option>
</select>

<label for="detail">その他・補足</label>
<textarea id="detail" name="補足" placeholder="今使っているツール、希望時期などがあればご記入ください。"></textarea>

<label class="check"><input type="checkbox" required><span><a href="../privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>を確認しました。パスワードなどの機密情報は送信しないでください。</span></label>
<button type="submit">無料相談を送信する</button>
</form>
</div>
<footer>© 2026 KOROPOP LABS / AI COMPANY</footer>
</main>
<script>
(function(){
  const p=new URLSearchParams(location.search);
  let src=p.get('src')||'';
  if(!src){
    try{
      const r=document.referrer?new URL(document.referrer):null;
      if(r && r.hostname===location.hostname) src=r.pathname.replace('/company/','').replace(/\/$/,'')||'company-home';
    }catch(e){}
  }
  if(!src) src='direct';
  document.getElementById('source').value=src;
  const next=document.querySelector('input[name="_next"]');
  next.value='https://koropopgames.com/company/thanks.html?src='+encodeURIComponent(src);
  const plan=document.getElementById('plan');
  const srcMap={
    'auto-solution':'中古車販売店スターター 49,800円〜',
    'vehicle-demo':'中古車販売店スターター 49,800円〜',
    'realestate-solution':'不動産管理スターター 49,800円〜',
    'inquiry-demo':'不動産管理スターター 49,800円〜',
    'one-task-solution':'1業務だけ自動化 39,800円〜',
    'report-demo':'1業務だけ自動化 39,800円〜',
    'google-maps-solution':'Googleマップ整備 19,800円〜',
    'google-profile-audit':'Googleマップ整備 19,800円〜',
    'maps-audit-personalized':'Googleマップ整備 19,800円〜',
    'recruit-flow':'採用ページ・応募導線 29,800円〜',
    'recruit-audit':'採用ページ・応募導線 29,800円〜',
    'recruit-proposal':'採用ページ・応募導線 29,800円〜',
    'inquiry-flow':'問い合わせ導線ミニ改善 29,800円〜',
    'inquiry-audit':'問い合わせ導線ミニ改善 29,800円〜',
    'inquiry-proposal':'問い合わせ導線ミニ改善 29,800円〜',
    'paper-form-proposal':'1業務だけ自動化 39,800円〜'
  };
  if(srcMap[src]) plan.value=srcMap[src];
  const form=document.querySelector('form');
  form.addEventListener('submit',()=>{if(window.gtag)gtag('event','lead_form_submit',{lead_source:src});});
})();
</script>
