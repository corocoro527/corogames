<title>無料相談｜KOROPOP LABS</title>
<meta name="description" content="KOROPOP LABSのAI・IT担当代行、業務自動化、Web制作に関する無料相談フォームです。">
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef5ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.75}
a{color:#74ddfb}.w{width:min(760px,calc(100% - 28px));margin:48px auto}.back{display:inline-block;margin-bottom:18px;color:#9fb0c6}
h1{font-size:clamp(32px,6vw,52px);line-height:1.15;margin:0 0 14px}.lead{color:#a9bbcf;margin:0 0 28px}
.box{background:#0d1a2b;border:1px solid #20334d;border-radius:22px;padding:28px}
.notice{padding:15px 16px;border-radius:14px;background:#10243a;border:1px solid #234666;color:#cfe6f8;margin-bottom:20px}
label{display:block;margin:18px 0 7px;font-weight:800}.req{font-size:11px;color:#7ce6ff;margin-left:6px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid #34506f;border-radius:10px;background:#07111f;color:#fff;font:inherit}
textarea{min-height:160px;resize:vertical}input:focus,select:focus,textarea:focus{outline:none;border-color:#68e1fd;box-shadow:0 0 0 3px rgba(104,225,253,.12)}
.help{font-size:12px;color:#8197b0;margin:6px 0 0}.check{display:flex;gap:10px;align-items:flex-start;margin-top:18px;color:#afc0d2;font-size:13px}.check input{width:auto;margin-top:6px}
button{width:100%;border:0;border-radius:999px;padding:15px 20px;margin-top:22px;background:linear-gradient(135deg,#68e1fd,#9a8bff);color:#06101e;font-weight:900;font-size:16px;cursor:pointer}
footer{margin-top:28px;color:#71859d;font-size:12px;text-align:center}
</style>
</head>
<body>
<main class="w">
<a class="back" href="./">← サービスページへ戻る</a>
<h1>30分の無料相談</h1>
<p class="lead">「何をAI化したらいいかわからない」でも大丈夫です。今の面倒な作業を教えてください。内容を確認して、改善できそうなところだけ整理します。</p>
<div class="box">
<div class="notice">営業電話や高額なシステム導入を前提にした相談ではありません。まずは状況確認から始めます。</div>
<form action="https://formsubmit.co/koropopgames.support@gmail.com" method="POST">
<input type="hidden" name="_subject" value="【KOROPOP LABS】無料相談">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_next" value="https://koropopgames.com/company/thanks.html">
<input type="hidden" name="_url" value="https://koropopgames.com/company/contact.html">
<input type="text" name="_honey" style="display:none">

<label for="company">会社名・屋号</label>
<input id="company" name="会社名・屋号" autocomplete="organization">

<label for="name">お名前<span class="req">必須</span></label>
<input id="name" name="お名前" autocomplete="name" required>

<label for="email">メールアドレス<span class="req">必須</span></label>
<input id="email" type="email" name="email" autocomplete="email" required>

<label for="industry">業種</label>
<select id="industry" name="業種">
<option value="">選択してください</option>
<option>不動産・賃貸管理</option><option>建設・工務店・リフォーム</option><option>設備・保守</option>
<option>小売・EC</option><option>自動車関連</option><option>士業・コンサル</option><option>飲食・サービス</option><option>その他</option>
</select>

<label for="url">WebサイトURL</label>
<input id="url" type="url" name="WebサイトURL" placeholder="https://">

<label for="issue">今いちばん面倒な仕事・改善したいこと<span class="req">必須</span></label>
<textarea id="issue" name="困りごと" required placeholder="例：問い合わせ返信に毎日1時間かかる、Excel集計が手作業、ホームページを直す人がいない 等"></textarea>

<label for="budget">ご予算のイメージ</label>
<select id="budget" name="予算感">
<option value="">まだ決めていない</option><option>〜5万円</option><option>5〜10万円</option><option>10〜30万円</option><option>30万円〜</option><option>月額で相談したい</option>
</select>

<label for="detail">その他・補足</label>
<textarea id="detail" name="補足" placeholder="今使っているツール、希望時期などがあればご記入ください。"></textarea>

<label class="check"><input type="checkbox" required><span><a href="../privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>を確認しました。パスワードなどの機密情報は送信しないでください。</span></label>
<button type="submit">無料相談を送信する</button>
</form>
</div>
<footer>© 2026 KOROPOP LABS / AI COMPANY</footer>
</main>
</body>
