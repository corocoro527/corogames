<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MANGA ZERO | Reader prototype</title><style>body{margin:0;background:#0e1014;color:#eee;font-family:system-ui,sans-serif}header{position:sticky;top:0;background:#1b1d24;padding:12px;display:flex;align-items:center;gap:15px;z-index:2}a{color:#ffbd7e}select{background:#272c34;color:white;padding:8px;max-width:70vw}main{max-width:850px;margin:auto}main img{width:100%;display:block;height:auto}#status{padding:20px;text-align:center;color:#bbc2cb}footer{padding:25px;text-align:center}</style></head><body><header><a href="./index.html">← 作品一覧</a><select id="episode" aria-label="エピソード"></select></header><div id="status">読み込み中…</div><main id="pages"></main><footer>移行検証用リーダー・ローカル画像があれば優先、なければFloot CDNを参照します</footer><script>
const original='episodes-original.json',remaining='episodes-remaining.json';const volumes={16:[[1,100],[101,200],[201,209]],17:[[1,100],[101,199]],18:[[1,100],[101,200],[201,221]]};const get=async p=>{const r=await fetch(p);if(!r.ok)throw Error(p+' '+r.status);return r.json()};let assetMap={};const asset=u=>assetMap[u]|| (u?.startsWith('/')?'https://manga-zero.floot.app'+u:u);async function run(){try{try{const manifest=await get('asset-manifest.json');assetMap=manifest.assets||{}}catch(e){console.info('No local asset manifest; using CDN',e)}const [a,b]=await Promise.all([get(original),get(remaining)]);const eps=[...a,...b,...[{id:16,slug:'blackjack-ni-yoroshiku',episode_number:1,title:'第1巻'}, {id:17,slug:'blackjack-ni-yoroshiku',episode_number:2,title:'第2巻'}, {id:18,slug:'blackjack-ni-yoroshiku',episode_number:3,title:'第3巻'}]].sort((x,y)=>x.slug.localeCompare(y.slug)||x.episode_number-y.episode_number);const select=document.getElementById('episode');for(const ep of eps){const o=document.createElement('option');o.value=ep.id;o.textContent=ep.slug+' / '+ep.title;select.append(o)}const qs=new URLSearchParams(location.search);select.value=eps.some(e=>String(e.id)===qs.get('id'))?qs.get('id'):String(eps[0].id);async function display(){const ep=eps.find(e=>String(e.id)===select.value);history.replaceState(null,'','?id='+ep.id);document.title=ep.title+' | MANGA ZERO';document.getElementById('status').textContent='ページを読み込み中…';let images=ep.images||[];if(volumes[ep.id]){const parts=await Promise.all(volumes[ep.id].map(async([start,end])=>get('volumes/episode-'+ep.id+'-pages-'+start+'-'+end+'.json')));images=parts.flat().map(p=>p.image)}const root=document.getElementById('pages');root.replaceChildren();images.forEach((url,i)=>{if(!url)return;const img=document.createElement('img');img.src=asset(url);img.alt=ep.title+' '+(i+1)+'ページ';img.loading=i<2?'eager':'lazy';root.append(img)});document.getElementById('status').textContent=images.length+'ページ（移行検証用）'}select.onchange=()=>display().catch(e=>document.getElementById('status').textContent=e.message);await display()}catch(e){document.getElementById('status').textContent='読み込み失敗: '+e.message}}run();
</script></body></html>
