<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MANGA ZERO — 移行用カタログ</title><style>
:root{color-scheme:dark}body{margin:0;background:#101217;color:#f3f4f6;font-family:system-ui,sans-serif}header{padding:24px 5%;border-bottom:1px solid #30343b}h1{margin:0;font-size:28px;letter-spacing:.07em}header p{color:#b9c0c9}main{padding:25px 5%;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}.card{background:#1c2028;border:1px solid #323946;border-radius:12px;overflow:hidden}.cover{width:100%;aspect-ratio:3/4;object-fit:cover;background:#292e38}.inner{padding:14px}h2{font-size:17px;margin:0 0 8px}.genre{color:#ffbd72;font-size:12px}.desc{font-size:13px;color:#bdc4cd;line-height:1.6}a{color:#ffd09a}small{color:#aab1bc}</style></head>
<body><header><h1>MANGA ZERO</h1><p>移行準備中の作品カタログ（公開済み作品のみ）</p></header><main><p id="status">作品を読み込み中…</p><div id="works" class="grid"></div></main><script>
(async()=>{try{const r=await fetch('./public-catalog.json');if(!r.ok)throw Error('catalog HTTP '+r.status);const d=await r.json();const offline=new URLSearchParams(location.search).get('offline')==='1';const preview=new URLSearchParams(location.search).get('preview')==='1';let local={};try{const m=await fetch('./asset-manifest.json');if(m.ok)local=(await m.json()).assets||{}}catch(e){}document.getElementById('status').textContent=d.works.length+'作品・'+d.works.reduce((n,w)=>n+w.episodes.length,0)+'話のメタデータを表示中。画像はローカルバックアップを優先します。'+(offline?' オフライン検証モード：外部画像の代替取得を無効化。':'')+'';const root=document.getElementById('works');for(const w of d.works){const card=document.createElement('article');card.className='card';if(w.cover_url&&!preview){const img=document.createElement('img');img.className='cover';img.loading='lazy';img.alt=w.title+'の表紙';img.src=local[w.cover_url]||(offline?'':(w.cover_url.startsWith('/')?'https://manga-zero.floot.app'+w.cover_url:w.cover_url));card.append(img)}const inner=document.createElement('div');inner.className='inner';const title=document.createElement('h2');title.textContent=w.title;const genre=document.createElement('div');genre.className='genre';genre.textContent=w.genre;const desc=document.createElement('p');desc.className='desc';desc.textContent=w.description;const link=document.createElement('a');link.href='./reader.html?id='+encodeURIComponent(w.episodes[0]?.id||'')+(offline?'&offline=1':'')+(preview?'&preview=1':'');link.textContent='第1話から読む ('+w.episodes.length+'話)';link.rel='noopener noreferrer';const episodes=document.createElement('details');const summary=document.createElement('summary');summary.textContent='全'+w.episodes.length+'話から選ぶ';episodes.append(summary);const list=document.createElement('ol');for(const ep of w.episodes){const item=document.createElement('li');const a=document.createElement('a');a.href='./reader.html?id='+encodeURIComponent(ep.id)+(offline?'&offline=1':'')+(preview?'&preview=1':'');a.textContent=ep.title||('第'+ep.episode_number+'話');item.append(a);list.append(item)}episodes.append(list);inner.append(title,genre,desc,link,episodes);card.append(inner);root.append(card)}if(preview)document.getElementById('status').textContent+=' 公開権限確認前のため画像は表示しません。'}catch(e){document.getElementById('status').textContent='カタログの読み込みに失敗しました: '+e.message}})();
</script></body></html>
