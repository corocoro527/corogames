<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MANGA ZERO — 移行用カタログ</title><style>
:root{color-scheme:dark}body{margin:0;background:#101217;color:#f3f4f6;font-family:system-ui,sans-serif}header{padding:24px 5%;border-bottom:1px solid #30343b}h1{margin:0;font-size:28px;letter-spacing:.07em}header p{color:#b9c0c9}main{padding:25px 5%;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}.card{background:#1c2028;border:1px solid #323946;border-radius:12px;overflow:hidden}.cover{width:100%;aspect-ratio:3/4;object-fit:cover;background:#292e38}.inner{padding:14px}h2{font-size:17px;margin:0 0 8px}.genre{color:#ffbd72;font-size:12px}.desc{font-size:13px;color:#bdc4cd;line-height:1.6}a{color:#ffd09a}small{color:#aab1bc}</style></head>
<body><header><h1>MANGA ZERO</h1><p>移行準備中の作品カタログ（公開済み作品のみ）</p></header><main><p id="status">作品を読み込み中…</p><div id="works" class="grid"></div></main><script>
(async()=>{try{const r=await fetch('./public-catalog.json');if(!r.ok)throw Error('catalog HTTP '+r.status);const d=await r.json();document.getElementById('status').textContent=d.works.length+'作品・'+d.works.reduce((n,w)=>n+w.episodes.length,0)+'話のメタデータを表示中。画像と本文は現在Floot側を参照します。';const root=document.getElementById('works');for(const w of d.works){const card=document.createElement('article');card.className='card';if(w.cover_url){const img=document.createElement('img');img.className='cover';img.loading='lazy';img.alt=w.title+'の表紙';img.src=w.cover_url.startsWith('/')?'https://manga-zero.floot.app'+w.cover_url:w.cover_url;card.append(img)}const inner=document.createElement('div');inner.className='inner';const title=document.createElement('h2');title.textContent=w.title;const genre=document.createElement('div');genre.className='genre';genre.textContent=w.genre;const desc=document.createElement('p');desc.className='desc';desc.textContent=w.description;const link=document.createElement('a');link.href='./reader.html?id='+encodeURIComponent(w.episodes[0]?.id||'');link.textContent='移行版リーダーで読む ('+w.episodes.length+'話)';link.rel='noopener noreferrer';inner.append(title,genre,desc,link);card.append(inner);root.append(card)}}catch(e){document.getElementById('status').textContent='カタログの読み込みに失敗しました: '+e.message}})();
</script></body></html>
