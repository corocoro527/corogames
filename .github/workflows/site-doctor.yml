name: KOROPOP Site Doctor

on:
  workflow_run:
    workflows:
      - "Auto Update Sitemap"
    types:
      - completed

  push:
    paths:
      - ".github/workflows/site-doctor.yml"

  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check repository
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          BASE = "https://koropopgames.com"
          GA = "G-8NWPD2QBCQ"

          files = sorted(Path(".").glob("*.html"))

          errors = []
          warnings = []


          def has_meta(html, name):
              pattern = (
                  r'<meta[^>]+'
                  r'name=["\']'
                  + re.escape(name)
                  + r'["\']'
              )

              return bool(
                  re.search(
                      pattern,
                      html,
                      re.I
                  )
              )


          def canonical_url(html):

              patterns = [
                  r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',
                  r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']',
              ]

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      html,
                      re.I
                  )

                  if match:
                      return match.group(1)

              return ""


          for path in files:

              html = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )


              # -------------------------
              # title
              # -------------------------

              if not re.search(
                  r"<title[^>]*>.+?</title>",
                  html,
                  re.I | re.S
              ):

                  errors.append(
                      f"{path.name}: titleなし"
                  )


              # -------------------------
              # description
              # -------------------------

              if (
                  path.name != "contact-thanks.html"
                  and not has_meta(
                      html,
                      "description"
                  )
              ):

                  warnings.append(
                      f"{path.name}: descriptionなし"
                  )


              # -------------------------
              # viewport
              # -------------------------

              if not has_meta(
                  html,
                  "viewport"
              ):

                  errors.append(
                      f"{path.name}: viewportなし"
                  )


              # -------------------------
              # article checks
              # -------------------------

              is_article = (
                  "koropop-theme.css"
                  in html
              )


              if is_article:

                  if GA not in html:

                      errors.append(
                          f"{path.name}: GA4なし"
                      )


                  h1_count = len(
                      re.findall(
                          r"<h1\b",
                          html,
                          re.I
                      )
                  )

                  if h1_count != 1:

                      errors.append(
                          f"{path.name}: H1が{h1_count}個"
                      )


                  if not has_meta(
                      html,
                      "robots"
                  ):

                      warnings.append(
                          f"{path.name}: robotsメタなし"
                      )


                  expected = (
                      f"{BASE}/{path.name}"
                  )

                  canonical = canonical_url(
                      html
                  )

                  if not canonical:

                      errors.append(
                          f"{path.name}: canonicalなし"
                      )

                  elif canonical != expected:

                      errors.append(
                          f"{path.name}: canonical不一致 → {canonical}"
                      )


                  if (
                      path.name != "career.html"
                      and "koropop-reader.js"
                      not in html
                  ):

                      warnings.append(
                          f"{path.name}: Reader Upgrade未導入"
                      )


              # -------------------------
              # internal links
              # -------------------------

              hrefs = re.findall(
                  r'href=["\']([^"\']+)["\']',
                  html,
                  re.I
              )


              for href in hrefs:

                  if (
                      not href
                      or href.startswith("#")
                      or href.startswith("http://")
                      or href.startswith("https://")
                      or href.startswith("mailto:")
                      or href.startswith("tel:")
                      or href.startswith("javascript:")
                      or href.startswith("data:")
                  ):

                      continue


                  target = href.split(
                      "#"
                  )[0].split(
                      "?"
                  )[0]


                  if not target:
                      continue


                  if target == "/":
                      target = "index.html"


                  target = target.lstrip(
                      "/"
                  )


                  if not Path(
                      target
                  ).exists():

                      errors.append(
                          f"{path.name}: リンク切れ → {href}"
                      )


          # -------------------------
          # sitemap
          # -------------------------

          sitemap = Path(
              "sitemap.xml"
          )


          if not sitemap.exists():

              errors.append(
                  "sitemap.xmlなし"
              )

          else:

              try:

                  tree = ET.parse(
                      sitemap
                  )

                  ns = {
                      "sm":
                      "http://www.sitemaps.org/schemas/sitemap/0.9"
                  }

                  urls = {
                      node.text.strip()
                      for node in tree.findall(
                          ".//sm:loc",
                          ns
                      )
                      if node.text
                  }


                  for path in files:

                      if path.name in {
                          "index.html",
                          "contact-thanks.html",
                "love-style.html",
                "love64-v2.html",
                      }:
                          continue


                      expected = (
                          f"{BASE}/{path.name}"
                      )


                      if expected not in urls:

                          errors.append(
                              f"sitemap漏れ: {path.name}"
                          )


              except Exception as error:

                  errors.append(
                      f"sitemap.xml解析失敗: {error}"
                  )


          print(
              f"Checked {len(files)} HTML files"
          )


          if warnings:

              print(
                  "\n=== WARNINGS ==="
              )

              for warning in warnings:

                  print(
                      "⚠️",
                      warning
                  )


          if errors:

              print(
                  "\n=== REAL ERRORS ==="
              )

              for error in errors:

                  print(
                      "❌",
                      error
                  )

              raise SystemExit(1)


          print(
              "\n✅ KOROPOP Site Doctor: ALL OK"
          )

          PY


      - name: Check live site
        if: >
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'

        run: |
          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET

          SITEMAP = (
              "https://koropopgames.com/sitemap.xml"
          )


          def fetch(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "KOROPOP-Site-Doctor/1.0"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:

                  return (
                      response.status,
                      response.read()
                  )


          status, body = fetch(
              SITEMAP
          )


          if status != 200:

              raise SystemExit(
                  f"Sitemap HTTP {status}"
              )


          root = ET.fromstring(
              body
          )

          ns = {
              "sm":
              "http://www.sitemaps.org/schemas/sitemap/0.9"
          }

          urls = [
              node.text.strip()
              for node in root.findall(
                  ".//sm:loc",
                  ns
              )
              if node.text
          ]


          bad = []


          for url in urls:

              try:

                  status, _ = fetch(
                      url
                  )

                  if status != 200:

                      bad.append(
                          f"{url} → HTTP {status}"
                      )

              except Exception as error:

                  bad.append(
                      f"{url} → {error}"
                  )


          print(
              f"Live checked {len(urls)} URLs"
          )


          if bad:

              print(
                  "\n=== LIVE ERRORS ==="
              )

              for item in bad:

                  print(
                      "❌",
                      item
                  )

              raise SystemExit(1)


          print(
              "\n✅ Live site: ALL OK"
          )

          PY
