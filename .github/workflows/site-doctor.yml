name: KOROPOP Site Doctor

on:
  workflow_run:
    workflows: ["Auto Update Sitemap"]
    types: [completed]

  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          BASE = "https://koropopgames.com"
          GA = "G-8NWPD2QBCQ"

          files = sorted(Path(".").glob("*.html"))

          errors = []
          warnings = []

          for p in files:

              html = p.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              # title
              if not re.search(
                  r"<title[^>]*>.+?</title>",
                  html,
                  re.I | re.S
              ):
                  errors.append(
                      f"{p.name}: titleなし"
                  )

              # description
              if p.name != "contact-thanks.html":

                  if not re.search(
                      r'<meta[^>]+name=["\']description["\']',
                      html,
                      re.I
                  ):
                      warnings.append(
                          f"{p.name}: descriptionなし"
                      )

              # viewport
              if not re.search(
                  r'<meta[^>]+name=["\']viewport["\']',
                  html,
                  re.I
              ):
                  errors.append(
                      f"{p.name}: viewportなし"
                  )

              is_article =
                  "koropop-theme.css" in html

              if is_article:

                  # GA4
                  if GA not in html:
                      errors.append(
                          f"{p.name}: GA4なし"
                      )

                  # H1
                  h1_count = len(
                      re.findall(
                          r"<h1\b",
                          html,
                          re.I
                      )
                  )

                  if h1_count != 1:
                      errors.append(
                          f"{p.name}: H1が{h1_count}個"
                      )

                  # robots は必須ではない
                  if not re.search(
                      r'<meta[^>]+name=["\']robots["\']',
                      html,
                      re.I
                  ):
                      warnings.append(
                          f"{p.name}: robotsメタなし（問題なし）"
                      )

                  # canonical
                  expected =
                      f"{BASE}/{p.name}"

                  m = re.search(
                      r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',
                      html,
                      re.I
                  )

                  if not m:

                      m = re.search(
                          r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical',
                          html,
                          re.I
                      )

                  if not m:

                      errors.append(
                          f"{p.name}: canonicalなし"
                      )

                  elif m.group(1) != expected:

                      errors.append(
                          f"{p.name}: canonical不一致"
                      )

                  # Reader Upgrade
                  if (
                      "koropop-reader.js"
                      not in html
                  ):
                      warnings.append(
                          f"{p.name}: Reader Upgrade未導入"
                      )

              # 内部リンク切れ
              for href in re.findall(
                  r'href=["\']([^"\']+)["\']',
                  html,
                  re.I
              ):

                  if (
                      not href
                      or href.startswith("#")
                      or href.startswith("http")
                      or href.startswith("mailto:")
                      or href.startswith("tel:")
                      or href.startswith("javascript:")
                  ):
                      continue

                  target = (
                      href
                      .split("#")[0]
                      .split("?")[0]
                  )

                  if target == "/":
                      target = "index.html"

                  target =
                      target.lstrip("/")

                  if (
                      target
                      and
                      not Path(target).exists()
                  ):
                      errors.append(
                          f"{p.name}: リンク切れ → {href}"
                      )


          # sitemap
          sitemap =
              Path("sitemap.xml")

          if not sitemap.exists():

              errors.append(
                  "sitemap.xmlなし"
              )

          else:

              tree =
                  ET.parse(sitemap)

              ns = {
                  "sm":
                  "http://www.sitemaps.org/schemas/sitemap/0.9"
              }

              urls = {
                  x.text.strip()
                  for x in tree.findall(
                      ".//sm:loc",
                      ns
                  )
                  if x.text
              }

              for p in files:

                  if p.name in {
                      "index.html",
                      "contact-thanks.html"
                  }:
                      continue

                  expected =
                      f"{BASE}/{p.name}"

                  if expected not in urls:

                      errors.append(
                          f"sitemap漏れ: {p.name}"
                      )


          print(
              f"Checked {len(files)} HTML files"
          )


          if warnings:

              print(
                  "\n=== WARNINGS ==="
              )

              for warning in warnings:
                  print(
                      "⚠",
                      warning
                  )


          if errors:

              print(
                  "\n=== REAL ERRORS ==="
              )

              for error in errors:
                  print(
                      "❌",
                      error
                  )

              raise SystemExit(1)


          print(
              "\n✅ KOROPOP Site Doctor: ALL OK"
          )

          PY


      - name: Check live site
        if: >
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'

        run: |
          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET

          sitemap =
              "https://koropopgames.com/sitemap.xml"

          def get(url):

              req =
                  urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                          "KOROPOP-Site-Doctor"
                      }
                  )

              with urllib.request.urlopen(
                  req,
                  timeout=20
              ) as response:

                  return (
                      response.status,
                      response.read()
                  )


          status, body =
              get(sitemap)

          if status != 200:

              raise SystemExit(
                  f"Sitemap HTTP {status}"
              )


          root =
              ET.fromstring(body)

          ns = {
              "sm":
              "http://www.sitemaps.org/schemas/sitemap/0.9"
          }

          urls = [
              x.text.strip()
              for x in root.findall(
                  ".//sm:loc",
                  ns
              )
              if x.text
          ]

          bad = []

          for url in urls:

              try:

                  status, _ =
                      get(url)

                  if status != 200:

                      bad.append(
                          f"{url} → HTTP {status}"
                      )

              except Exception as error:

                  bad.append(
                      f"{url} → {error}"
                  )


          print(
              f"Live checked {len(urls)} URLs"
          )


          if bad:

              print(
                  "\n=== LIVE ERRORS ==="
              )

              for item in bad:
                  print(
                      "❌",
                      item
                  )

              raise SystemExit(1)


          print(
              "✅ Live site: ALL OK"
          )

          PY
