          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET

          SITEMAP = (
              "https://koropopgames.com/sitemap.xml"
          )


          def fetch(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "KOROPOP-Site-Doctor/1.0"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:

                  return (
                      response.status,
                      response.read()
                  )


          status, body = fetch(
              SITEMAP
          )


          if status != 200:

              raise SystemExit(
                  f"Sitemap HTTP {status}"
              )


          root = ET.fromstring(
              body
          )

          ns = {
              "sm":
              "http://www.sitemaps.org/schemas/sitemap/0.9"
          }

          urls = [
              node.text.strip()
              for node in root.findall(
                  ".//sm:loc",
                  ns
              )
              if node.text
          ]


          bad = []


          for url in urls:

              try:

                  status, _ = fetch(
                      url
                  )

                  if status != 200:

                      bad.append(
                          f"{url} → HTTP {status}"
                      )

              except Exception as error:

                  bad.append(
                      f"{url} → {error}"
                  )


          print(
              f"Live checked {len(urls)} URLs"
          )


          if bad:

              print(
                  "\n=== LIVE ERRORS ==="
              )

              for item in bad:

                  print(
                      "❌",
                      item
                  )

              raise SystemExit(1)


          print(
              "\n✅ Live site: ALL OK"
          )

          PY
