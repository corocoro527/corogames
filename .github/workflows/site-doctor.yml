name: KOROPOP Site Doctor

on:
  workflow_run:
    workflows:
      - "Auto Update Sitemap"
    types:
      - completed

  push:
    paths:
      - ".github/workflows/site-doctor.yml"
      - "scripts/test-career-*.cjs"

  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check repository
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          BASE = "https://koropopgames.com"
          GA = "G-8NWPD2QBCQ"

          files = sorted(Path(".").glob("*.html"))

          errors = []
          warnings = []


          def has_meta(html, name):
              pattern = (
                  r'<meta[^>]+'
                  r'name=["\']'
                  + re.escape(name)
                  + r'["\']'
              )

              return bool(
                  re.search(
                      pattern,
                      html,
                      re.I
                  )
              )


          def canonical_url(html):

              patterns = [
                  r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',
                  r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']',
              ]

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      html,
                      re.I
                  )

                  if match:
                      return match.group(1)

              return ""


          for path in files:

              html = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )


              # -------------------------
              # title
              # -------------------------

              if not re.search(
                  r"<title[^>]*>.+?</title>",
                  html,
                  re.I | re.S
              ):

                  errors.append(
                      f"{path.name}: titleなし"
                  )


              # -------------------------
              # description
              # -------------------------

              if (
                  path.name != "contact-thanks.html"
                  and not has_meta(
                      html,
                      "description"
                  )
              ):

                  warnings.append(
                      f"{path.name}: descriptionなし"
                  )


              # -------------------------
              # viewport
              # -------------------------

              if not has_meta(
                  html,
                  "viewport"
              ):

                  errors.append(
                      f"{path.name}: viewportなし"
                  )


              # -------------------------
              # article checks
              # -------------------------

              is_article = (
                  "koropop-theme.css"
                  in html
              )


              if is_article:

                  if GA not in html:

                      errors.append(
                          f"{path.name}: GA4なし"
                      )


                  h1_count = len(
                      re.findall(
                          r"<h1\b",
                          html,
                          re.I
                      )
                  )

                  if h1_count != 1:

                      errors.append(
                          f"{path.name}: H1が{h1_count}個"
                      )


                  if not has_meta(
                      html,
                      "robots"
                  ):

                      warnings.append(
                          f"{path.name}: robotsメタなし"
                      )


                  expected = (
                      f"{BASE}/{path.name}"
                  )

                  canonical = canonical_url(
                      html
                  )

                  if not canonical:

                      errors.append(
                          f"{path.name}: canonicalなし"
                      )

                  elif canonical != expected:

                      errors.append(
                          f"{path.name}: canonical不一致 → {canonical}"
                      )


                  if (
                      path.name != "career.html"
                      and "koropop-reader.js"
                      not in html
                  ):

                      warnings.append(
                          f"{path.name}: Reader Upgrade未導入"
                      )


              # -------------------------
              # internal links
              # -------------------------

              hrefs = re.findall(
                  r'href=["\']([^"\']+)["\']',
                  html,
                  re.I
              )


              for href in hrefs:

                  if (
                      not href
                      or href.startswith("#")
                      or href.startswith("http://")
                      or href.startswith("https://")
                      or href.startswith("mailto:")
                      or href.startswith("tel:")
                      or href.startswith("javascript:")
                      or href.startswith("data:")
                  ):

                      continue


                  target = href.split(
                      "#"
                  )[0].split(
                      "?"
                  )[0]


                  if not target:
                      continue


                  if target == "/":
                      target = "index.html"


                  target = target.lstrip(
                      "/"
                  )


                  if not Path(
                      target
                  ).exists():

                      errors.append(
                          f"{path.name}: リンク切れ → {href}"
                      )


          # -------------------------
          # sitemap
          # -------------------------

          sitemap = Path(
              "sitemap.xml"
          )


          if not sitemap.exists():

              errors.append(
                  "sitemap.xmlなし"
              )

          else:

              try:

                  tree = ET.parse(
                      sitemap
                  )

                  ns = {
                      "sm":
                      "http://www.sitemaps.org/schemas/sitemap/0.9"
                  }

                  urls = {
                      node.text.strip()
                      for node in tree.findall(
                          ".//sm:loc",
                          ns
                      )
                      if node.text
                  }


                  for path in files:

                      # The main sitemap lists editorial pages, not
                      # legacy diagnosis redirects or non-canonical pages.
                      if (
                          path.name in {
                              "index.html", "career.html", "contact-thanks.html",
                              "love-style.html", "love64-v2.html", "love64.html",
                              "love64-types.html", "love64-type.html",
                              "love64-compat.html", "love64-guide.html",
                              "shindan.html", "site-portal.html"
                          }
                          or path.name.startswith("love64-")
                      ):
                          continue


                      expected = (
                          f"{BASE}/{path.name}"
                      )


                      if expected not in urls:

                          errors.append(
                              f"sitemap漏れ: {path.name}"
                          )


              except Exception as error:

                  errors.append(
                      f"sitemap.xml解析失敗: {error}"
                  )


          # AdSense/readability smoke tests — protect the new IT focus.
          terms = Path("terms.html").read_text(encoding="utf-8")
          if "恋タイプ64" in terms:
              errors.append("メイン利用規約に旧診断ブランドが残存")
          root = Path("index.html").read_text(encoding="utf-8")
          if "未経験から" not in root or "career-general.html" not in root:
              errors.append("IT専門トップ・一般記事への導線が不足")
          txt = Path("ads.txt")
          if not txt.exists() or "pub-1125809356622056" not in txt.read_text(encoding="utf-8"):
              warnings.append("ads.txt未配置またはパブリッシャーID不一致")
          privacy = Path("privacy.html").read_text(encoding="utf-8")
          if "FormSubmit" not in privacy or "Google Analytics 4" not in privacy:
              errors.append("プライバシー情報と運用中のサービスが不一致")
          for article in ("mikeiken-it-tenshoku.html", "mikeiken-shanai-se.html",
                          "it-job-nenshu-hikaku.html"):
              if 'id="koropop-decision-practice"' not in Path(article).read_text(encoding="utf-8"):
                  warnings.append(f"{article}: 独自の判断ワークが未反映")

          # Verify editorial index pages and enhanced comparison worksheet.
          index_pages = ["index.html", "career-general.html"]
          utility_pages = ["shokushu-hikaku.html", "kyujin-check.html",
                           "kyujin-joken-hikaku.html",
                           "about.html", "privacy.html", "terms.html", "contact.html"]
          featured = set()
          for directory in index_pages:
              html = Path(directory).read_text(encoding="utf-8")
              featured.update(re.findall(
                  r'class="article-link" href="([^"]+\.html)"', html
              ))
          if len(featured) < 27:
              errors.append("記事一覧に既存の27記事がそろっていません")
          for article in sorted(featured):
              if not Path(article).exists():
                  errors.append(f"記事一覧のリンク切れ: {article}")
          
          for page in sorted(featured | set(index_pages + utility_pages)):
              if not Path(page).exists():
                  continue
              content = Path(page).read_text(encoding="utf-8")
              if not has_meta(content, "google-adsense-account"):
                  warnings.append(f"{page}: サイト確認用メタタグが欠落")
              if GA not in content:
                  warnings.append(f"{page}: GA4タグが欠落")
          
          comparison = Path("shokushu-hikaku.html").read_text(encoding="utf-8")
          for element in ('id="memoTitle"', 'id="copyQuestions"',
                          'id="questionList"', 'class="job-info-grid"'):
              if element not in comparison:
                  errors.append("IT職種比較ツールの主要機能が不足: " + element)

          # Protect the second, independent job-offer comparison tool.
          offer_page = Path("kyujin-joken-hikaku.html").read_text(encoding="utf-8")
          for token in ('id="compareButton"', 'id="copyResult"',
                        'id="resetCompare"', 'id="resultBody"',
                        'function calc(item)', 'function validate(item)'):
              if token not in offer_page:
                  errors.append("求人条件比較ツールの基本機能が不足: " + token)
          if 'href="kyujin-joken-hikaku.html"' not in Path("index.html").read_text(encoding="utf-8"):
              errors.append("トップから求人条件比較ツールへの導線がありません")
          for page in ("mikeiken-it-kyujin-miwakekata.html", "it-job-nenshu-hikaku.html"):
              if 'href="kyujin-joken-hikaku.html"' not in Path(page).read_text(encoding="utf-8"):
                  warnings.append(page + ": 求人条件比較ツールへのリンクが不足")

          # Prevent regressions in the IT job map and HTML-based reading paths.
          home_html = Path("index.html").read_text(encoding="utf-8")
          if 'id="job-map"' not in home_html:
              errors.append("IT職種6種類の早見表が見つかりません")
          map_urls = re.findall(r'class="career-role-card" href="([^"]+)"', home_html)
          if len(map_urls) != 6 or any(not Path(url).exists() for url in map_urls):
              errors.append("職種早見表は6件の有効な記事リンクが必要")
          if (home_html.find('id="job-map"') < 0 or
              home_html.find('class="featured-section"') < 0 or
              home_html.find('id="job-map"') > home_html.find('class="featured-section"')):
              errors.append("職種比較が最初のおすすめ記事より下に移動しています")
          # Keep the main journey crawlable and helpful even if scripts fail.
          path_targets = re.findall(
              r'<li><a href="([^"]+)"><span class="career-path-num">', home_html
          )
          expected_path = [
              "shokushu-hikaku.html",
              "mikeiken-it-study-roadmap.html",
              "mikeiken-it-kyujin-miwakekata.html",
              "it-mikeiken-shokumukeirekisho.html",
              "mikeiken-it-mensetsu-20.html",
          ]
          if path_targets != expected_path or any(not Path(url).exists() for url in path_targets):
              errors.append("職種比較→学習→求人確認→職務経歴書→面接練習のHTMLリンク導線が壊れています")
          if 'class="search-fallback-links"' not in home_html:
              warnings.append("検索0件からのおすすめ導線がありません")
          if ".career-path-list" not in Path("career-extras.css").read_text(encoding="utf-8"):
              errors.append("職種比較から次に読む導線のスタイルがありません")
          reader_code = Path("koropop-reader.js").read_text(encoding="utf-8")
          if "max-width: 760px" not in reader_code or "tocButton.hidden" not in reader_code:
              warnings.append("モバイル目次・固定ボタンの読みやすさ設定が不足")
          if "koropop-share-btn" not in reader_code:
              warnings.append("記事の共有・リンクコピー機能が不足")
          next_link_count = 0
          for article in sorted(featured):
              if article == "mikeiken-it-study-roadmap.html":
                  continue
              if article not in Path("koropop-articles.json").read_text(encoding="utf-8"):
                  continue
              page = Path(article).read_text(encoding="utf-8")
              if 'class="kp-next-guides"' in page:
                  section = page.split('class="kp-next-guides"', 1)[1].split("</aside>", 1)[0]
                  destinations = re.findall(r'href="([^"]+\.html)"', section)
                  if len(destinations) != 3 or any(not Path(url).exists() for url in destinations):
                      errors.append(f"{article}: 次に読む記事のリンクを要確認")
                  next_link_count += len(destinations)
          if next_link_count < 63:
              warnings.append(f"静的な関連記事リンクが不足: {next_link_count}/63")
          
          print(
              f"Checked {len(files)} HTML files"
          )


          if warnings:

              print(
                  "\n=== WARNINGS ==="
              )

              for warning in warnings:

                  print(
                      "⚠️",
                      warning
                  )


          if errors:

              print(
                  "\n=== REAL ERRORS ==="
              )

              for error in errors:

                  print(
                      "❌",
                      error
                  )

              raise SystemExit(1)


          print(
              "\n✅ KOROPOP Site Doctor: ALL OK"
          )

          PY


      - name: Validate reader and search JavaScript
        run: |
          node --check koropop-reader.js
          node --check koropop-related.js
          node --check career-search.js
          node scripts/test-career-search.cjs
          node --check career-next-action.js
          node scripts/test-career-next-action.cjs
          node scripts/test-career-workday-visual.cjs
          node --check career-workrole-worksheet.js
          node scripts/test-career-workrole-worksheet.cjs
          node scripts/test-career-reading-system.cjs
          node scripts/test-career-landmarks.cjs
          node scripts/audit-career-public-pages.cjs
          node scripts/test-career-indexability.cjs
          node scripts/test-career-discovery-paths.cjs
          node scripts/test-career-real-work-links.cjs
          node scripts/test-career-indexed-hubs.cjs
          node scripts/test-career-discovery-26.cjs
          node scripts/test-career-schema-and-contrast.cjs
          node --check career-salary-estimator.js
          node scripts/test-career-salary-estimator.cjs
          node scripts/test-career-related-catalog.cjs
          # Stage-use analytics must never include search keywords or free-text job notes.
          python3 - <<'PY'
          from pathlib import Path
          js = Path("career-search.js").read_text(encoding="utf-8")
          home = Path("index.html").read_text(encoding="utf-8")
          privacy = Path("privacy.html").read_text(encoding="utf-8")
          css = Path("career-extras.css").read_text(encoding="utf-8")
          if "career_step_" not in js or "step_destination:link.getAttribute('href')" not in js:
              raise SystemExit("転職準備の5ステップ計測が不足")
          if 'src="career-search.js?v=' not in home:
              raise SystemExit("GA4導線計測のスクリプトが読み込まれていません")
          if "検索窓の入力文字や職務経歴書" not in privacy:
              raise SystemExit("アクセス解析と入力内容の取り扱いの説明が不足")
          if "repeat(auto-fit,minmax(178px,1fr))" not in css:
              raise SystemExit("5ステップの可読性を保つモバイル対応が不足")
          PY
          # Confirm the interactive 4-week worksheet remains valid JavaScript.
          python3 - <<'PY'
          from pathlib import Path
          page = Path("mikeiken-it-study-roadmap.html").read_text(encoding="utf-8")
          storage_key = "koropop-career-roadmap-v1"
          required = ("localStorage.getItem(storageKey)", "localStorage.setItem(storageKey",
                      "planCount", "resetPlan", "copyPlan")
          if storage_key not in page or not all(token in page for token in required):
              raise SystemExit("4週間ロードマップの進捗保存または操作が不足")
          if "<script>" not in page or "</script>" not in page:
              raise SystemExit("4週間ロードマップのスクリプトがありません")
          Path("/tmp/koropop-roadmap-check.js").write_text(
              page.rsplit("<script>", 1)[1].split("</script>", 1)[0], encoding="utf-8"
          )
          PY
          node --check /tmp/koropop-roadmap-check.js
          # Guard the standalone career comparison and preference navigator.
          python3 - <<'PY'
          from pathlib import Path
          page = Path("shokushu-hikaku.html").read_text(encoding="utf-8")
          required = (
              'id="role-explore"', 'id="roleAction"', 'id="roleSchedule"',
              'id="roleLearning"', 'id="showRoleCandidates"',
              'id="roleCandidates"', 'preferenceScores',
              "opts.querySelectorAll", 'candidateReasons'
          )
          if not all(token in page for token in required):
              raise SystemExit("IT職種ナビの入力・表示・比較表連動が不足")
          code = page.rsplit("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/koropop-role-navigator-check.js").write_text(
              code, encoding="utf-8"
          )
          PY
          node --check /tmp/koropop-role-navigator-check.js
          # Three original beginner IT career guides: source transparency, crawlable links, and JS syntax.
          python3 - <<'PY'
          from pathlib import Path
          home = Path("index.html").read_text(encoding="utf-8")
          sitemap = Path("sitemap.xml").read_text(encoding="utf-8")
          expected = {
              "ses-haken-jisha-ukeoi-chigai.html": (
                  'id="table"', 'id="check"',
                  'https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000077386_00020.html'),
              "it-mikeiken-shokumukeirekisho.html": (
                  'id="buildResume"', 'id="copyResume"',
                  'https://www.job-card.mhlw.go.jp/guidance'),
              "it-helpdesk-ichinichi.html": (
                  'id="schedule"', 'id="trouble"',
                  'https://shigoto.mhlw.go.jp/User/Occupation/Detail/320'),
          }
          for name, needs in expected.items():
              page = Path(name).read_text(encoding="utf-8")
              if any(token not in page for token in needs):
                  raise SystemExit(name + ": 必要な実用コンテンツ・根拠が不足")
              if 'href="' + name + '"' not in home:
                  raise SystemExit(name + ": トップページからの導線なし")
              if 'https://koropopgames.com/' + name not in sitemap:
                  raise SystemExit(name + ": サイトマップに未登録")
              if 'class="deep-related"' not in page:
                  raise SystemExit(name + ": 関連記事導線なし")
          css = Path("career-deep-guides.css").read_text(encoding="utf-8")
          if ".deep-wrap" not in css or ".deep-form" not in css:
              raise SystemExit("新しいIT記事のスマホ用スタイルがありません")
          page = Path("it-mikeiken-shokumukeirekisho.html").read_text(encoding="utf-8")
          code = page.rsplit("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/corogames-new-career-resume-check.js").write_text(
              code, encoding="utf-8")
          PY
          node --check /tmp/corogames-new-career-resume-check.js
          node scripts/test-career-resume-print.cjs
          # PC kitting educational guide: verified sources, 7-step worksheet, SEO and local links.
          python3 - <<'PY'
          from pathlib import Path
          page = Path("pc-kitting-mikeiken.html").read_text(encoding="utf-8")
          home = Path("index.html").read_text(encoding="utf-8")
          sitemap = Path("sitemap.xml").read_text(encoding="utf-8")
          css = Path("career-deep-guides.css").read_text(encoding="utf-8")
          requirements = (
              'rel="canonical"', 'id="flow"', 'id="checklist"',
              'id="copyKitMemo"', 'id="resetKitMemo"', 'id="kittingCount"',
              'https://shigoto.mhlw.go.jp/User/Occupation/Detail/531',
              'https://learn.microsoft.com/ja-jp/autopilot/'
          )
          if any(value not in page for value in requirements):
              raise SystemExit("PCキッティング記事の出典・機能・見出しが不足")
          if page.count('data-kit-step=') != 7:
              raise SystemExit("PCキッティング7工程のチェック項目が欠落")
          if 'href="pc-kitting-mikeiken.html"' not in home:
              raise SystemExit("PCキッティング記事にトップから移動できません")
          if "https://koropopgames.com/pc-kitting-mikeiken.html" not in sitemap:
              raise SystemExit("PCキッティング記事がサイトマップにありません")
          if ".deep-checks" not in css:
              raise SystemExit("PCキッティング用のスマホスタイルがありません")
          for name in ("mikeiken-it-helpdesk.html", "it-helpdesk-ichinichi.html"):
              if 'href="pc-kitting-mikeiken.html"' not in Path(name).read_text(encoding="utf-8"):
                  raise SystemExit(name + ": PCキッティングへの関連記事導線がありません")
          code = page.rsplit("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/koropop-pc-kitting.js").write_text(code, encoding="utf-8")
          PY
          node --check /tmp/koropop-pc-kitting.js
          # IT interview training guide: all 20 questions must be crawlable, safe and linked.
          python3 - <<'PY'
          from pathlib import Path
          page = Path("mikeiken-it-mensetsu-20.html").read_text(encoding="utf-8")
          home = Path("index.html").read_text(encoding="utf-8")
          sitemap = Path("sitemap.xml").read_text(encoding="utf-8")
          css = Path("career-deep-guides.css").read_text(encoding="utf-8")
          markers = (
              'id="interview-practice"', 'id="interviewQuestion"',
              'id="createInterviewMemo"', 'id="copyInterviewMemo"',
              'id="clearInterviewMemo"', 'id="interviewResult"',
              'id="questionHint"', 'id="sources"',
              'https://jsite.mhlw.go.jp/kagawa-hellowork/',
              'https://shigoto.mhlw.go.jp/User/Occupation/Detail/320'
          )
          if any(token not in page for token in markers):
              raise SystemExit("面接20問記事の出典・入力・表示機能に欠落")
          if page.count('class="interview-question"') != 20:
              raise SystemExit("面接質問は20件必要")
          if page.count('class="practice-link" data-question=') != 20:
              raise SystemExit("20問の練習導線が不足")
          if page.count('<option value="') < 21:
              raise SystemExit("質問選択肢が不足")
          if ".interview-questions" not in css:
              raise SystemExit("面接質問のスマホ表示CSSが不足")
          if 'href="mikeiken-it-mensetsu-20.html"' not in home:
              raise SystemExit("トップページから面接記事へのリンクなし")
          if 'https://koropopgames.com/mikeiken-it-mensetsu-20.html' not in sitemap:
              raise SystemExit("面接記事がサイトマップ未登録")
          for file in ("mikeiken-it-shibodoki.html",
                       "mikeiken-it-kyujin-miwakekata.html",
                       "it-mikeiken-shokumukeirekisho.html"):
              if 'mikeiken-it-mensetsu-20.html' not in Path(file).read_text(encoding="utf-8"):
                  raise SystemExit(file + ": 面接への内部リンクがない")
