name: Reader Files Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Validate reader scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check koropop-reader.js
          node --check koropop-related.js
      - name: Verify critical files exist
        run: |
          test -f index.html
          test -f career-article-v2.css
          test -f koropop-articles.json
