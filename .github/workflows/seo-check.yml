name: SEO integrity checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  seo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate sitemap, canonical and indexability
        run: python scripts/check_seo.py
