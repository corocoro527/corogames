name: Build Career Hub

on:
  push:
    paths:
      - "*.html"
      - ".github/workflows/build-career-hub.yml"
      - "!career.html"
      - "!index.html"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build career hub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import html
          import subprocess
          from datetime import date

          BASE = "https://koropopgames.com"

          EXCLUDE = {
              "index.html",
              "career.html",
              "about.html",
              "contact.html",
              "contact-thanks.html",
              "privacy.html",
              "shindan.html",
              "tedori.html",
          }

          def text_from(pattern, source):
              m = re.search(pattern, source, re.I | re.S)
              if not m:
                  return ""
              value = re.sub(r"<[^>]+>", "", m.group(1))
              return html.unescape(value).strip()

          def get_title(source):
              title = text_from(r"<title[^>]*>(.*?)</title>", source)

              title = re.sub(
                  r"\s*[｜|-]\s*KOROPOP GAMES.*$",
                  "",
                  title,
                  flags=re.I
              )

              return title.strip()

          def get_description(source):
              patterns = [
                  r'<meta[^>]+name=["\']description["\'][^>]+content=["\']([^"\']+)["\']',
                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']description["\']'
              ]

              for pattern in patterns:
                  m = re.search(pattern, source, re.I)
                  if m:
                      return html.unescape(m.group(1)).strip()

              return ""

          def lastmod(filename):
              try:
                  out = subprocess.check_output(
                      [
                          "git",
                          "log",
                          "-1",
                          "--format=%cs",
                          "--",
                          filename
                      ],
                      text=True
                  ).strip()

                  return out or str(date.today())

              except Exception:
                  return str(date.today())

          def category(filename, title, description):
              text = f"{filename} {title} {description}"

              it_words = [
                  "IT",
                  "エンジニア",
                  "社内SE",
                  "ヘルプデスク",
                  "インフラ",
                  "ネットワーク",
                  "クラウド",
                  "SOC",
                  "プログラミング",
                  "リモート"
              ]

              work_words = [
                  "仕事",
                  "職種",
                  "楽な",
                  "関わらない",
                  "収入アップ"
              ]

              if any(word.lower() in text.lower() for word in it_words):
                  return "it"

              if any(word in text for word in work_words):
                  return "work"

              return "career"

          articles = []

          for path in sorted(Path(".").glob("*.html")):

              if path.name in EXCLUDE:
                  continue

              source = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              title = get_title(source)

              if not title:
                  continue

              description = get_description(source)

              career_words = [
                  "仕事",
                  "転職",
                  "職種",
                  "年収",
                  "資格",
                  "エンジニア",
                  "社内SE",
                  "ヘルプデスク",
                  "インフラ",
                  "ネットワーク",
                  "クラウド",
                  "SOC"
              ]

              searchable = (
                  path.name == "jobs.html"
                  or any(
                      word.lower() in
                      f"{title} {description}".lower()
                      for word in career_words
                  )
              )

              if not searchable:
                  continue

              articles.append({
                  "file": path.name,
                  "title": title,
                  "description": description,
                  "date": lastmod(path.name),
                  "category": category(
                      path.name,
                      title,
                      description
                  )
              })

          articles.sort(
              key=lambda x: (
                  x["date"],
                  x["title"]
              ),
              reverse=True
          )

          def esc(value):
              return html.escape(
                  value,
                  quote=True
              )

          def card(article):
              desc = article["description"]

              if len(desc) > 115:
                  desc = desc[:112].rstrip() + "…"

              return f'''
          <a class="article-card" href="{esc(article["file"])}">
            <h3>{esc(article["title"])}</h3>
            <p>{esc(desc)}</p>
            <span class="date">更新：{esc(article["date"])}</span>
          </a>'''

          def cards(category_name):
              items = [
                  x for x in articles
                  if x["category"] == category_name
              ]

              if not items:
                  return '<p class="empty">記事を準備中です。</p>'

              return "\n".join(
                  card(x)
                  for x in items
              )

          career_count = len(articles)

          output = f'''<!doctype html>
          <html lang="ja">

          <head>

          <!-- Google tag -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-8NWPD2QBCQ"></script>

          <script>
          window.dataLayer=window.dataLayer||[];
          function gtag(){{dataLayer.push(arguments);}}
          gtag('js',new Date());
          gtag('config','G-8NWPD2QBCQ');
          </script>

          <meta charset="utf-8">

          <meta
            name="viewport"
            content="width=device-width,initial-scale=1"
          >

          <title>
          仕事・転職ガイド｜未経験転職・仕事選び・年収・IT転職【2026年版】｜KOROPOP GAMES
          </title>

          <meta
            name="description"
            content="未経験転職、資格なしで目指せる仕事、人と関わらない仕事、楽な仕事、収入アップ、20代・30代転職、未経験IT転職までまとめた仕事・転職総合ガイドです。"
          >

          <link
            rel="canonical"
            href="{BASE}/career.html"
          >

          <link
            rel="stylesheet"
            href="koropop-theme.css"
          >

          <meta
            name="robots"
            content="index,follow,max-image-preview:large"
          >

          <meta
            property="og:type"
            content="website"
          >

          <meta
            property="og:title"
            content="仕事・転職ガイド｜KOROPOP GAMES"
          >

          <meta
            property="og:description"
            content="仕事選び・未経験転職・年収・IT転職の記事を目的別に探せます。"
          >

          <meta
            property="og:url"
            content="{BASE}/career.html"
          >

          <meta
            property="og:site_name"
            content="KOROPOP GAMES"
          >

          <style>

          *{{
            box-sizing:border-box;
          }}

          html{{
            scroll-behavior:smooth;
          }}

          .container{{
            width:min(100% - 28px,1120px);
            margin:auto;
          }}

          header{{
            padding:18px 0;
          }}

          .nav{{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:14px;
          }}

          .brand{{
            font-weight:900;
            text-decoration:none;
          }}

          .hero{{
            max-width:950px;
            margin:24px auto 30px;
            padding:46px 36px;
          }}

          .hero h1{{
            margin:15px 0 13px;
            font-size:clamp(2rem,6vw,3.4rem);
            line-height:1.3;
          }}

          .badge{{
            display:inline-block;
            padding:6px 11px;
            border-radius:999px;
            font-size:.8rem;
            font-weight:800;
          }}

          .answer{{
            margin-top:22px;
            padding:19px 21px;
            border-radius:14px;
          }}

          .stats{{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            margin-top:16px;
          }}

          .stat{{
            background:#fff;
            border:1px solid #dfe5ec;
            border-radius:999px;
            padding:7px 12px;
            color:#475467;
            font-size:.82rem;
          }}

          .quick{{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:11px;
            margin:25px 0 48px;
          }}

          .quick a{{
            display:block;
            background:#fff;
            border:1px solid #dfe5ec;
            border-radius:14px;
            padding:17px;
            text-decoration:none;
            font-weight:800;
            color:#174a7e;
          }}

          .quick small{{
            display:block;
            color:#667085;
            font-weight:500;
            margin-top:4px;
          }}

          section{{
            margin-bottom:50px;
          }}

          .start-grid{{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:12px;
          }}

          .start{{
            padding:19px;
            background:#fff;
            border:1px solid #dfe5ec;
            border-radius:15px;
          }}

          .start:nth-child(1){{
            border-top:4px solid #1677df;
          }}

          .start:nth-child(2){{
            border-top:4px solid #6e56cf;
          }}

          .start:nth-child(3){{
            border-top:4px solid #16845a;
          }}

          .start h3{{
            margin-top:0;
          }}

          .section-head{{
            display:flex;
            justify-content:space-between;
            align-items:end;
            gap:16px;
            margin-bottom:16px;
          }}

          .section-head h2{{
            margin:0;
          }}

          .section-head p{{
            margin:0;
            color:#667085;
            font-size:.9rem;
          }}

          .article-grid{{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:13px;
          }}

          .article-card{{
            display:block;
            background:#fff;
            color:inherit;
            border:1px solid #dfe5ec;
            border-radius:15px;
            padding:19px;
            text-decoration:none;
            transition:
              transform .15s ease,
              box-shadow .15s ease;
          }}

          .article-card:hover{{
            transform:translateY(-2px);
            box-shadow:
              0 8px 24px
              rgba(16,24,40,.07);
          }}

          .article-card h3{{
            margin:0 0 8px;
            color:#174a7e;
            font-size:1.06rem;
            line-height:1.5;
          }}

          .article-card p{{
            margin:0;
            color:#667085;
            font-size:.9rem;
          }}

          .date{{
            display:block;
            margin-top:10px;
            color:#98a2b3;
            font-size:.74rem;
          }}

          .tip{{
            padding:19px;
            border-radius:14px;
          }}

          footer{{
            padding:34px 15px;
            text-align:center;
            font-size:.84rem;
          }}

          @media(max-width:820px){{

            .quick{{
              grid-template-columns:1fr 1fr;
            }}

            .start-grid{{
              grid-template-columns:1fr;
            }}

          }}

          @media(max-width:620px){{

            .hero{{
              padding:32px 19px;
            }}

            .quick,
            .article-grid{{
              grid-template-columns:1fr;
            }}

            .section-head{{
              display:block;
            }}

            .section-head p{{
              margin-top:5px;
            }}

          }}

          </style>

          <script type="application/ld+json">
          {{
            "@context":"https://schema.org",
            "@type":"CollectionPage",
            "name":"仕事・転職ガイド",
            "url":"{BASE}/career.html",
            "description":"KOROPOP GAMESの仕事・転職関連記事を目的別にまとめた総合ページです。",
            "isPartOf":{{
              "@type":"WebSite",
              "name":"KOROPOP GAMES",
              "url":"{BASE}/"
            }}
          }}
          </script>

          </head>

          <body>

          <header>

          <div class="container nav">

          <a
            class="brand"
            href="index.html"
          >
          KOROPOP GAMES
          </a>

          <a href="index.html">
          トップへ
          </a>

          </div>

          </header>


          <div class="container">

          <div class="hero">

          <span class="badge">
          💼 仕事・転職の総合入口
          </span>

          <h1>
          仕事・転職ガイド
          </h1>

          <p>
          「何の仕事が合う？」
          「未経験でもいける？」
          「収入を上げたい」
          「ITも気になる」。
          目的から必要な記事へ
          すぐ移動できるようにまとめています。
          </p>

          <div class="answer">

          <strong>
          迷ったらここから。
          </strong>

          <br>

          まず
          「今の仕事で減らしたいもの」と
          「次の仕事で増やしたいもの」を
          1つずつ決めてみてください。

          </div>

          <div class="stats">

          <span class="stat">
          📚 転職関連記事 {career_count} 本
          </span>

          <span class="stat">
          🔄 記事追加時に自動更新
          </span>

          </div>

          </div>


          <nav
            class="quick"
            aria-label="目的別メニュー"
          >

          <a href="#work">

          🔎 仕事を探す

          <small>
          条件・働き方から探す
          </small>

          </a>

          <a href="#career">

          🧭 転職を考える

          <small>
          未経験・年代別
          </small>

          </a>

          <a href="#it">

          💻 ITを目指す

          <small>
          職種・資格・年収
          </small>

          </a>

          <a href="tedori.html">

          🧮 手取りを計算

          <small>
          給与をシミュレーション
          </small>

          </a>

          </nav>


          <section>

          <h2>
          まず決める3つ
          </h2>

          <div class="start-grid">

          <div class="start">

          <h3>
          ① 何を減らしたい？
          </h3>

          <p>
          人間関係、体力、ノルマ、
          夜勤など、
          今特にしんどいものを決めます。
          </p>

          </div>

          <div class="start">

          <h3>
          ② 何を増やしたい？
          </h3>

          <p>
          収入、休日、専門性、
          一人時間など、
          次の仕事で欲しいものを決めます。
          </p>

          </div>

          <div class="start">

          <h3>
          ③ 求人で確かめる
          </h3>

          <p>
          職種名だけでなく、
          仕事内容、給与、勤務時間、
          将来の経験まで確認します。
          </p>

          </div>

          </div>

          </section>


          <section id="work">

          <div class="section-head">

          <div>
          <h2>
          仕事選び・働き方
          </h2>
          </div>

          <p>
          条件から仕事候補を探したい人向け
          </p>

          </div>

          <div class="article-grid">

          {cards("work")}

          </div>

          </section>


          <section id="career">

          <div class="section-head">

          <div>
          <h2>
          未経験転職・転職準備
          </h2>
          </div>

          <p>
          転職の進め方を知りたい人向け
          </p>

          </div>

          <div class="article-grid">

          {cards("career")}

          </div>

          </section>


          <section id="it">

          <div class="section-head">

          <div>
          <h2>
          未経験IT転職
          </h2>
          </div>

          <p>
          ITを候補にしたい人向け
          </p>

          </div>

          <div class="article-grid">

          {cards("it")}

          </div>

          </section>


          <section>

          <div class="tip">

          <strong>
          この一覧は自動更新されます。
          </strong>

          <br>

          今後KOROPOP GAMESへ
          仕事・転職系の記事を追加すると、
          このページの記事一覧も
          自動で作り直されます。

          </div>

          </section>

          </div>


          <footer>

          <a href="index.html">
          トップ
          </a>

           ・

          <a href="about.html">
          このサイトについて
          </a>

           ・

          <a href="privacy.html">
          プライバシーポリシー
          </a>

           ・

          <a href="contact.html">
          お問い合わせ
          </a>

          <br>

          © 2026 KOROPOP GAMES

          </footer>

          </body>
          </html>
          '''

          Path("career.html").write_text(
              output,
              encoding="utf-8"
          )

          index = Path("index.html")

          if index.exists():

              source = index.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              if 'href="career.html"' not in source:

                  block = '''
          <section class="section">

          <a
            href="career.html"
            class="card"
            style="display:block"
          >

          <h3>
          📚 仕事・転職の記事を全部見る
          </h3>

          <p>
          仕事選び・未経験転職・年収・IT転職を
          目的別にまとめた総合ページです。
          </p>

          </a>

          </section>
          '''

                  marker = '<section class="about">'

                  if marker in source:
                      source = source.replace(
                          marker,
                          block + "\n" + marker,
                          1
                      )

                  else:
                      source = source.replace(
                          "</main>",
                          block + "\n</main>",
                          1
                      )

                  index.write_text(
                      source,
                      encoding="utf-8"
                  )

          print(
              f"Career hub built with {career_count} articles"
          )
          PY

      - name: Commit generated hub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add career.html index.html

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Auto update career hub"
          git push
