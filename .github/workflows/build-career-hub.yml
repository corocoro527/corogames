name: Update Career Directory

on:
  push:
    paths:
      - "*.html"
      - ".github/workflows/build-career-hub.yml"
      - "!index.html"
      - "!career.html"
      - "!career-general.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add new guides to IT specialist and general directories
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import json
          import re

          home_path = Path("index.html")
          general_path = Path("career-general.html")
          home = home_path.read_text(encoding="utf-8")
          general = general_path.read_text(encoding="utf-8")
          known = set(re.findall(r'class="article-link" href="([^"]+)"', home + general))
          excluded = {
              "index.html", "career.html", "career-general.html",
              "about.html", "privacy.html", "terms.html",
              "contact.html", "contact-thanks.html", "tedori.html",
              "shindan.html", "site-portal.html", "love-style.html",
              "love64.html", "love64-v2.html", "love64-type.html",
              "love64-types.html", "love64-guide.html", "love64-compat.html",
              "kyujin-check.html", "shokushu-hikaku.html",
              "kyujin-joken-hikaku.html",
          }

          def plain(text):
              return html.unescape(re.sub(r"<[^>]+>", "", text)).strip()

          def extract_meta(page):
              title_match = re.search(r"<title[^>]*>(.*?)</title>", page, re.I | re.S)
              desc_match = re.search(r'<meta[^>]+name=["\']description["\'][^>]+content=["\']([^"\']*)', page, re.I)
              if not desc_match:
                  desc_match = re.search(r'<meta[^>]+content=["\']([^"\']*)["\'][^>]+name=["\']description["\']', page, re.I)
              title = plain(title_match.group(1)).split("｜KOROPOP")[0] if title_match else ""
              summary = plain(desc_match.group(1)) if desc_match else ""
              return title, summary[:112] + ("…" if len(summary) > 112 else "")

          def classify(filename, title):
              name = filename.lower()
              if name.startswith(("raku-", "hito-to-", "shigoto-")) or name in {
                  "jobs.html", "mikeiken-shikaku-nashi-shigoto.html",
                  "20s-mikeiken-tenshoku.html"
              }:
                  return "general"
              if any(k in name for k in ("nenshu", "remote", "salary")) or "年収" in title:
                  return "future"
              if "kitting" in name or "キッティング" in title:
                  return "roles"
              if any(k in name for k in ("shibodoki", "kyujin", "mensetsu", "rirekisho", "keirekisho", "ses-", "oubo")) or any(k in title for k in ("志望動機", "求人の見分け方", "面接の準備")):
                  return "apply"
              if any(k in name for k in ("shanai", "helpdesk", "infra", "network", "cloud", "soc", "security", "engineer")) or any(k in title for k in ("社内SE", "ヘルプデスク", "インフラ", "ネットワーク", "クラウド", "SOC")):
                  return "roles"
              if any(k in name for k in ("it-", "programming", "shikaku")) or any(k in title for k in ("IT", "プログラミング", "エンジニア")):
                  return "start"
              return "general"

          def add_card(source, section, filename, title, desc):
              labels = {
                  "start": "はじめ方", "roles": "IT職種",
                  "apply": "求人・応募", "future": "年収・キャリア",
                  "general": "一般の仕事・転職",
              }
              card = (
                  '<a class="article-link" href="' + html.escape(filename, quote=True) + '">'
                  '<span class="card-kicker">' + labels[section] + '</span>'
                  '<h3>' + html.escape(title) + '</h3>'
                  '<p>' + html.escape(desc) + '</p>'
                  '<span class="read-link">記事を読む <span aria-hidden="true">↗</span></span>'
                  '</a>'
              )
              pattern = r'(<section class="topic-section(?: [^"]*)?" id="' + section + r'"[\s\S]*?<div class="article-grid">)([\s\S]*?)(</div>)'
              source, count = re.subn(pattern, lambda m: m.group(1) + m.group(2) + "\n" + card + "\n" + m.group(3), source, count=1)
              if count != 1:
                  raise RuntimeError("Missing directory: " + section)
              return source

          added = []
          for file in sorted(Path(".").glob("*.html")):
              filename = file.name
              if filename in excluded or filename in known or filename.startswith("love64-"):
                  continue
              source = file.read_text(encoding="utf-8", errors="replace")
              if 'name="koropop-page-type" content="utility"' in source:
                  continue
              if re.search(r'<meta[^>]+http-equiv=["\']refresh["\']', source, re.I) or "window.location.replace(" in source[:1600]:
                  continue
              if not re.search(r'<(?:main|article)\b', source, re.I):
                  continue
              title, summary = extract_meta(source)
              if len(title) < 12:
                  continue
              category = classify(filename, title)
              if category == "general":
                  general = add_card(general, category, filename, title, summary)
              else:
                  home = add_card(home, category, filename, title, summary)
              known.add(filename)
              added.append((filename, category))

          # Keep contextual reading recommendations in sync with newly published guides.
          # Historical editorial entries remain curated; utility pages stay excluded.
          related_path = Path("koropop-articles.json")
          related_items = json.loads(related_path.read_text(encoding="utf-8"))
          related_known = {item["url"] for item in related_items}
          recommended_added = []
          tag_words = (
              "社内SE", "ヘルプデスク", "キッティング", "SES", "派遣",
              "インフラ", "クラウド", "ネットワーク", "セキュリティ",
              "職務経歴書", "志望動機", "面接", "求人", "資格", "勉強",
              "年収", "1日", "未経験", "転職", "IT",
          )
          for filename, section in added:
              if filename in related_known:
                  continue
              page_source = Path(filename).read_text(encoding="utf-8")
              title, summary = extract_meta(page_source)
              content = title + " " + summary
              tags = [tag for tag in tag_words if tag in content]
              if section != "general" and "IT" not in tags:
                  tags.append("IT")
              related_items.append({
                  "url": filename,
                  "title": title,
                  "description": summary,
                  "category": "work" if section == "general" else "it",
                  "tags": tags[:10],
              })
              related_known.add(filename)
              recommended_added.append(filename)
          if recommended_added:
              related_path.write_text(
                  json.dumps(related_items, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              print("Added to related-reading catalog:", recommended_added)

          def recount(source, categories):
              for section in categories:
                  pattern = r'(<section class="topic-section(?: [^"]*)?" id="' + section + r'"[\s\S]*?)(?=</section>)'
                  match = re.search(pattern, source)
                  if not match:
                      raise RuntimeError("Missing category " + section)
                  segment = match.group(1)
                  count = len(re.findall(r'class="article-link"', segment))
                  segment = re.sub(r'<span class="section-count">\d+ ARTICLES</span>',
                                   '<span class="section-count">' + str(count) + ' ARTICLES</span>',
                                   segment, count=1)
                  source = source[:match.start(1)] + segment + source[match.end(1):]
              return source

          if added:
              home_path.write_text(recount(home, ("start", "roles", "apply", "future")), encoding="utf-8")
              general_path.write_text(recount(general, ("general",)), encoding="utf-8")
              print("Added", len(added), "new guides:", added)
          else:
              print("No new guides; existing editorial structure preserved")

          PY
      - name: Commit only if directory changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html career-general.html koropop-articles.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Auto add newly published guides to correct category"
          git pull --rebase origin main
          git push origin main
