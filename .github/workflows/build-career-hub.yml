name: Update Career Directory

on:
  push:
    paths:
      - "*.html"
      - ".github/workflows/build-career-hub.yml"
      - "!index.html"
      - "!career.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add newly published articles to the editorial directory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import re

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")
          existing = set(re.findall(r'class="article-link" href="([^"]+)"', source))
          excluded = {
              "index.html", "career.html", "about.html", "privacy.html",
              "terms.html", "contact.html", "contact-thanks.html",
              "shindan.html", "site-portal.html", "love-style.html",
              "love64.html", "love64-v2.html", "love64-type.html",
              "love64-types.html", "love64-guide.html", "love64-compat.html",
              "tedori.html",
          }

          def plain(s):
              s = re.sub(r"<[^>]+>", "", s)
              return html.unescape(s).strip()

          def article_metadata(filename):
              data = Path(filename).read_text(encoding="utf-8", errors="replace")
              title = re.search(r"<title[^>]*>(.*?)</title>", data, re.I | re.S)
              desc = re.search(r'<meta[^>]+name=["\']description["\'][^>]+content=["\']([^"\']*)', data, re.I)
              if desc is None:
                  desc = re.search(r'<meta[^>]+content=["\']([^"\']*)["\'][^>]+name=["\']description["\']', data, re.I)
              title = plain(title.group(1)).split("｜KOROPOP")[0] if title else filename
              summary = plain(desc.group(1)) if desc else ""
              return title, summary[:112] + ("…" if len(summary) > 112 else "")

          def group(filename):
              work = {"mikeiken-shikaku-nashi-shigoto.html", "raku-na-shigoto.html",
                      "jobs.html", "hito-to-kakawaranai-shigoto.html"}
              career = {"mikeiken-it-shibodoki.html", "mikeiken-it-kyujin-miwakekata.html",
                        "shigoto-yametai-tsugi-kimattenai.html", "20s-mikeiken-tenshoku.html"}
              if filename in work or filename.startswith(("raku-", "hito-to-")):
                  return "work"
              if filename in career or filename.startswith("shigoto-"):
                  return "career"
              return "it"

          new = []
          for article in sorted(Path(".").glob("*.html")):
              filename = article.name
              if filename in excluded or filename in existing or filename.startswith("love"):
                  continue
              content = article.read_text(encoding="utf-8", errors="replace")
              if 'http-equiv="refresh"' in content[:1500] or "window.location.replace(" in content[:1500]:
                  continue
              if not re.search(r'<(?:article|main)\b', content, re.I):
                  continue
              title, summary = article_metadata(filename)
              if not title or len(title) < 12:
                  continue
              new.append((filename, title, summary, group(filename)))

          for filename, title, summary, section in new:
              category = {"work":"WORK STYLES","career":"CAREER CHANGE","it":"IT CAREERS"}[section]
              card = ('<a class="article-link" href="' + html.escape(filename, quote=True) + '">'
                      '<span class="card-kicker">' + category + '</span>'
                      '<h3>' + html.escape(title) + '</h3>'
                      '<p>' + html.escape(summary) + '</p>'
                      '<span class="read-link">記事を読む <span aria-hidden="true">↗</span></span>'
                      '</a>')
              pattern = r'(<section class="topic-section" id="' + section + r'"[\s\S]*?<div class="article-grid">)([\s\S]*?)(</div>\s*</section>)'
              def insert(m):
                  return m.group(1) + m.group(2) + "\n" + card + "\n" + m.group(3)
              source, count = re.subn(pattern, insert, source, count=1)
              if count != 1:
                  raise RuntimeError("Could not locate article grid for " + section)

          for section in ("work", "career", "it"):
              pat = r'(<section class="topic-section" id="' + section + r'"[\s\S]*?<span class="section-count">)\d+ ARTICLES'
              match = re.search(r'<section class="topic-section" id="' + section + r'"([\s\S]*?)</section>', source)
              if match:
                  count = len(re.findall(r'class="article-link"', match.group(1)))
                  source = re.sub(pat, lambda m: m.group(1) + str(count) + " ARTICLES", source, count=1)

          if new:
              path.write_text(source, encoding="utf-8")
              print("Added", len(new), "new articles to the designed directory")
          else:
              print("No new articles; editorial design unchanged")
          PY
      - name: Commit only if directory changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Auto add new career articles to homepage"
          git pull --rebase origin main
          git push origin main
