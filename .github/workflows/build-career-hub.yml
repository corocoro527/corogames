name: Build Career Hub

on:
  push:
    paths:
      - "*.html"
      - ".github/workflows/build-career-hub.yml"
      - "!career.html"
      - "!index.html"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build career hub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import html
          import subprocess
          from datetime import date

          BASE = "https://koropopgames.com"

          EXCLUDE = {
              "index.html",
              "career.html",
              "about.html",
              "contact.html",
              "contact-thanks.html",
              "privacy.html",
              "shindan.html",
              "tedori.html",
          }


          def text_from(pattern, source):
              match = re.search(
                  pattern,
                  source,
                  re.I | re.S
              )

              if not match:
                  return ""

              value = re.sub(
                  r"<[^>]+>",
                  "",
                  match.group(1)
              )

              return html.unescape(
                  value
              ).strip()


          def get_title(source):
              title = text_from(
                  r"<title[^>]*>(.*?)</title>",
                  source
              )

              title = re.sub(
                  r"\s*[｜|-]\s*KOROPOP GAMES.*$",
                  "",
                  title,
                  flags=re.I
              )

              return title.strip()


          def get_description(source):
              patterns = [
                  r'<meta[^>]+name=["\']description["\'][^>]+content=["\']([^"\']+)["\']',
                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']description["\']'
              ]

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      source,
                      re.I
                  )

                  if match:
                      return html.unescape(
                          match.group(1)
                      ).strip()

              return ""


          def lastmod(filename):
              try:
                  result = subprocess.check_output(
                      [
                          "git",
                          "log",
                          "-1",
                          "--format=%cs",
                          "--",
                          filename
                      ],
                      text=True
                  ).strip()

                  return result or str(
                      date.today()
                  )

              except Exception:
                  return str(
                      date.today()
                  )


          def category(filename, title, description):

              filename_lower = filename.lower()
              title_lower = title.lower()

              # -------------------------
              # 仕事選び
              # -------------------------

              work_markers = [
                  "楽な仕事",
                  "しんどくない仕事",
                  "人と関わらない",
                  "収入アップを目指せる仕事",
                  "資格なし・未経験から目指せる仕事",
              ]

              if (
                  filename == "jobs.html"
                  or any(
                      marker.lower()
                      in title_lower
                      for marker
                      in work_markers
                  )
              ):
                  return "work"


              # -------------------------
              # 転職準備
              # -------------------------

              career_markers = [
                  "辞めたい",
                  "次が決まってない",
                  "退職理由",
                  "転職理由",
                  "志望動機",
                  "面接",
                  "職務経歴書",
                  "履歴書",
                  "転職活動",
              ]

              career_files = {
                  "20s-mikeiken-tenshoku.html",
                  "shigoto-yametai-tsugi-kimattenai.html",
              }

              if (
                  filename in career_files
                  or any(
                      marker.lower()
                      in title_lower
                      for marker
                      in career_markers
                  )
              ):
                  return "career"


              # -------------------------
              # IT転職
              # -------------------------

              filename_is_it = (
                  "-it-" in filename_lower
                  or filename_lower.startswith("it-")
                  or filename_lower.endswith("-it.html")
                  or "infra" in filename_lower
                  or "network" in filename_lower
                  or "cloud" in filename_lower
                  or "shanai-se" in filename_lower
                  or "helpdesk" in filename_lower
                  or "soc-" in filename_lower
              )

              it_markers = [
                  "it転職",
                  "itエンジニア",
                  "エンジニア",
                  "社内se",
                  "ヘルプデスク",
                  "インフラ",
                  "ネットワーク",
                  "クラウド",
                  "soc",
                  "セキュリティ",
                  "プログラミング",
              ]

              if (
                  filename_is_it
                  or any(
                      marker.lower()
                      in title_lower
                      for marker
                      in it_markers
                  )
              ):
                  return "it"


              # -------------------------
              # その他仕事系
              # -------------------------

              generic_work = [
                  "仕事",
                  "職種",
              ]

              if any(
                  marker in title
                  for marker
                  in generic_work
              ):
                  return "work"

              return "career"


          def is_career_article(
              filename,
              title,
              description
          ):

              if filename == "jobs.html":
                  return True

              text = (
                  title
                  + " "
                  + description
              ).lower()

              words = [
                  "仕事",
                  "転職",
                  "職種",
                  "年収",
                  "資格",
                  "退職",
                  "面接",
                  "履歴書",
                  "職務経歴書",
                  "エンジニア",
                  "社内se",
                  "ヘルプデスク",
                  "インフラ",
                  "ネットワーク",
                  "クラウド",
                  "soc",
              ]

              return any(
                  word.lower() in text
                  for word in words
              )


          articles = []


          for path in sorted(
              Path(".").glob("*.html")
          ):

              if path.name in EXCLUDE:
                  continue

              source = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              title = get_title(
                  source
              )

              if not title:
                  continue

              description = get_description(
                  source
              )

              if not is_career_article(
                  path.name,
                  title,
                  description
              ):
                  continue

              articles.append({
                  "file": path.name,
                  "title": title,
                  "description": description,
                  "date": lastmod(
                      path.name
                  ),
                  "category": category(
                      path.name,
                      title,
                      description
                  )
              })


          articles.sort(
              key=lambda item: (
                  item["date"],
                  item["title"]
              ),
              reverse=True
          )


          def esc(value):
              return html.escape(
                  value,
                  quote=True
              )


          def card(article):

              description = (
                  article["description"]
              )

              if len(description) > 115:
                  description = (
                      description[:112]
                      .rstrip()
                      + "…"
                  )

              return f'''
          <a
            class="article-card"
            href="{esc(article["file"])}"
          >

            <h3>
            {esc(article["title"])}
            </h3>

            <p>
            {esc(description)}
            </p>

            <span class="date">
            更新：{esc(article["date"])}
            </span>

          </a>
          '''


          def cards(category_name):

              items = [
                  article
                  for article in articles
                  if article["category"]
                  == category_name
              ]

              return "\n".join(
                  card(article)
                  for article in items
              )


          work_cards = cards(
              "work"
          )

          career_cards = cards(
              "career"
          )

          it_cards = cards(
              "it"
          )

          career_count = len(
              articles
          )


