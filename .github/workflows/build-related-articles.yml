          def category(filename, title, description):

              text = (
                  filename
                  + " "
                  + title
                  + " "
                  + description
              ).lower()

              filename_lower = filename.lower()

              it_words = [
                  "エンジニア",
                  "社内se",
                  "ヘルプデスク",
                  "インフラ",
                  "ネットワーク",
                  "クラウド",
                  "soc",
                  "プログラミング",
                  "リモート",
              ]

              work_words = [
                  "楽な仕事",
                  "仕事15選",
                  "仕事12選",
                  "仕事20選",
                  "関わらない",
                  "資格なし",
                  "職種",
              ]

              filename_is_it = (
                  "-it-" in filename_lower
                  or filename_lower.startswith("it-")
                  or filename_lower.endswith("-it.html")
              )

              if (
                  filename_is_it
                  or any(
                      word.lower() in text
                      for word in it_words
                  )
              ):
                  return "it"

              if any(
                  word.lower() in text
                  for word in work_words
              ):
                  return "work"

              return "career"
