name: Build Related Articles

on:
  workflow_run:
    workflows:
      - "Auto Finish Articles"
    types:
      - completed

  push:
    paths:
      - ".github/workflows/build-related-articles.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build related article system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import html
          import json

          EXCLUDE = {
              "index.html",
              "career.html",
              "about.html",
              "contact.html",
              "contact-thanks.html",
              "privacy.html",
              "shindan.html",
              "tedori.html",
          }

          TAG_WORDS = [
              "未経験",
              "20代",
              "30代",
              "転職",
              "仕事",
              "年収",
              "資格",
              "辞めたい",
              "退職",
              "楽",
              "人と関わらない",
              "IT",
              "社内SE",
              "ヘルプデスク",
              "インフラ",
              "ネットワーク",
              "クラウド",
              "SOC",
              "プログラミング",
              "リモート",
              "求人",
              "向いている",
          ]


          def get_title(source):

              match = re.search(
                  r"<title[^>]*>(.*?)</title>",
                  source,
                  re.I | re.S
              )

              if not match:
                  return ""

              value = re.sub(
                  r"<[^>]+>",
                  "",
                  match.group(1)
              )

              value = html.unescape(value)

              value = re.sub(
                  r"\s*[｜|-]\s*KOROPOP GAMES.*$",
                  "",
                  value,
                  flags=re.I
              )

              return re.sub(
                  r"\s+",
                  " ",
                  value
              ).strip()


          def get_description(source):

              patterns = [
                  r'<meta[^>]+name=["\']description["\'][^>]+content=["\']([^"\']+)["\']',
                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']description["\']',
              ]

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      source,
                      re.I
                  )

                  if match:
                      return html.unescape(
                          match.group(1)
                      ).strip()

              return ""


          def category(filename, title, description):

              text = (
                  filename
                  + " "
                  + title
                  + " "
                  + description
              ).lower()

              it_words = [
                  "it",
                  "エンジニア",
                  "社内se",
                  "ヘルプデスク",
                  "インフラ",
                  "ネットワーク",
                  "クラウド",
                  "soc",
                  "プログラミング",
                  "リモート",
              ]

              work_words = [
                  "楽な仕事",
                  "仕事15選",
                  "仕事12選",
                  "仕事20選",
                  "関わらない",
                  "資格なし",
                  "職種",
              ]

              if any(
                  word.lower() in text
                  for word in it_words
              ):
                  return "it"

              if any(
                  word.lower() in text
                  for word in work_words
              ):
                  return "work"

              return "career"


          articles = []


          for path in sorted(
              Path(".").glob("*.html")
          ):

              if path.name in EXCLUDE:
                  continue

              source = path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              # 転職記事だけ対象
              if "koropop-theme.css" not in source:
                  continue

              title = get_title(source)

              if not title:
                  continue

              description = get_description(
                  source
              )

              searchable = (
                  title
                  + " "
                  + description
              )

              tags = [
                  word
                  for word in TAG_WORDS
                  if word.lower()
                  in searchable.lower()
              ]

              articles.append({
                  "url": path.name,
                  "title": title,
                  "description": description,
                  "category": category(
                      path.name,
                      title,
                      description
                  ),
                  "tags": tags
              })


          Path(
              "koropop-articles.json"
          ).write_text(
              json.dumps(
                  articles,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )


          related_js = r'''(() => {

          async function initRelated(){

            const article =
              document.querySelector("article") ||
              document.querySelector("main");

            if(!article){
              return;
            }


            if(
              document.querySelector(
                ".koropop-related-auto"
              )
            ){
              return;
            }


            let data = [];

            try{

              const response =
                await fetch(
                  "koropop-articles.json?v=2",
                  {
                    cache:"no-cache"
                  }
                );

              if(!response.ok){
                return;
              }

              data =
                await response.json();

            }catch(error){
              return;
            }


            const currentUrl =
              decodeURIComponent(
                location.pathname
                .split("/")
                .pop()
              );


            const current =
              data.find(
                item =>
                  item.url === currentUrl
              );


            if(!current){
              return;
            }


            function score(candidate){

              let points = 0;

              if(
                candidate.category ===
                current.category
              ){
                points += 12;
              }


              const shared =
                candidate.tags.filter(
                  tag =>
                    current.tags.includes(tag)
                );

              points +=
                shared.length * 5;


              if(
                current.category === "it" &&
                candidate.category === "it"
              ){
                points += 4;
              }


              return points;
            }


            let candidates =
              data
              .filter(
                item =>
                  item.url !== current.url
              )
              .map(
                item => ({
                  ...item,
                  score:score(item)
                })
              )
              .sort(
                (a,b) =>
                  b.score - a.score
              );


            let related =
              candidates
              .filter(
                item =>
                  item.score > 0
              )
              .slice(0,4);


            if(related.length < 4){

              const used =
                new Set(
                  related.map(
                    item => item.url
                  )
                );

              for(const item of candidates){

                if(
                  related.length >= 4
                ){
                  break;
                }

                if(
                  !used.has(item.url)
                ){

                  related.push(item);

                  used.add(
                    item.url
                  );

                }

              }

            }


            if(related.length === 0){
              return;
            }


            const section =
              document.createElement(
                "section"
              );

            section.className =
              "koropop-related-auto";


            const cards =
              related
              .map(item => {

                let description =
                  item.description || "";

                if(
                  description.length > 90
                ){
                  description =
                    description
                    .slice(0,87)
                    .trim()
                    + "…";
                }

                return `
                  <a
                    class="koropop-related-card"
                    href="${escapeHtml(item.url)}"
                  >

                    <span class="koropop-related-label">
                      ${label(item.category)}
                    </span>

                    <strong>
                      ${escapeHtml(item.title)}
                    </strong>

                    <span class="koropop-related-desc">
                      ${escapeHtml(description)}
                    </span>

                    <span class="koropop-related-more">
                      続きを読む →
                    </span>

                  </a>
                `;

              })
              .join("");


            section.innerHTML = `

              <div class="koropop-related-head">

                <div>

                  <span class="koropop-related-eyebrow">
                    NEXT
                  </span>

                  <h2>
                    次に読むならこれ
                  </h2>

                  <p>
                    今読んでいる内容に近い記事を
                    自動で選んでいます。
                  </p>

                </div>

                <a
                  class="koropop-related-all"
                  href="career.html"
                >
                  仕事・転職の記事一覧 →
                </a>

              </div>

              <div class="koropop-related-grid">
                ${cards}
              </div>

            `;


            const sources =
              article.querySelector(
                ".sources"
              );


            if(sources){

              sources.insertAdjacentElement(
                "beforebegin",
                section
              );

            }else{

              article.appendChild(
                section
              );

            }


            const style =
              document.createElement(
                "style"
              );

            style.textContent = `

            .koropop-related-auto{
              margin:
                52px 0
                44px;
              padding:
                25px;
              border:
                1px solid
                #d9e3ed;
              border-radius:
                18px;
              background:
                linear-gradient(
                  135deg,
                  #f7fbff,
                  #ffffff 55%,
                  #f8f5ff
                );
            }

            .koropop-related-head{
              display:flex;
              justify-content:
                space-between;
              align-items:end;
              gap:18px;
              margin-bottom:18px;
            }

            .koropop-related-head h2{
              margin:
                3px 0 5px;
              padding:0;
              border:0;
              background:none;
            }

            .koropop-related-head p{
              margin:0;
              color:#667085;
              font-size:.9rem;
            }

            .koropop-related-eyebrow{
              color:#6e56cf;
              font-size:.73rem;
              font-weight:900;
              letter-spacing:.12em;
            }

            .koropop-related-all{
              flex:0 0 auto;
              font-size:.84rem;
              font-weight:800;
              text-decoration:none;
            }

            .koropop-related-grid{
              display:grid;
              grid-template-columns:
                repeat(2,1fr);
              gap:11px;
            }

            .koropop-related-card{
              display:flex;
              flex-direction:column;
              gap:7px;
              min-width:0;
              padding:17px;
              background:#fff;
              border:
                1px solid
                #dfe6ee;
              border-radius:14px;
              color:inherit;
              text-decoration:none;
              transition:
                transform .15s ease,
                box-shadow .15s ease,
                border-color .15s ease;
            }

            .koropop-related-card:hover{
              transform:
                translateY(-2px);
              border-color:#bfd4e7;
              box-shadow:
                0 8px 24px
                rgba(16,24,40,.07);
            }

            .koropop-related-card strong{
              color:#174a7e;
              line-height:1.5;
            }

            .koropop-related-label{
              align-self:flex-start;
              padding:
                4px 8px;
              border-radius:999px;
              background:#eef5fc;
              color:#35658e;
              font-size:.7rem;
              font-weight:800;
            }

            .koropop-related-desc{
              color:#667085;
              font-size:.86rem;
              line-height:1.65;
            }

            .koropop-related-more{
              margin-top:auto;
              padding-top:3px;
              color:#1677df;
              font-size:.8rem;
              font-weight:800;
            }


            @media(max-width:650px){

              .koropop-related-auto{
                margin-top:40px;
                padding:18px;
                border-radius:15px;
              }

              .koropop-related-head{
                display:block;
              }

              .koropop-related-all{
                display:inline-block;
                margin-top:9px;
              }

              .koropop-related-grid{
                grid-template-columns:1fr;
              }

            }

            `;

            document.head.appendChild(
              style
            );

          }


          function label(category){

            if(category === "it"){
              return "💻 IT転職";
            }

            if(category === "work"){
              return "💼 仕事選び";
            }

            return "🧭 転職";
          }


          function escapeHtml(value){

            const div =
              document.createElement(
                "div"
              );

            div.textContent =
              String(value || "");

            return div.innerHTML;
          }


          if(
            document.readyState ===
            "loading"
          ){

            document.addEventListener(
              "DOMContentLoaded",
              initRelated
            );

          }else{

            initRelated();

          }

          })();
          '''


          Path(
              "koropop-related.js"
          ).write_text(
              related_js,
              encoding="utf-8"
          )


          reader =
              Path("koropop-reader.js")


          if reader.exists():

              source =
                  reader.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )

              marker =
                  "KOROPOP_RELATED_LOADER"


              if marker not in source:

                  loader = r'''

          /* KOROPOP_RELATED_LOADER */
          (() => {

            if(
              document.querySelector(
                'script[src*="koropop-related.js"]'
              )
            ){
              return;
            }

            const script =
              document.createElement(
                "script"
              );

            script.src =
              "koropop-related.js";

            script.async = true;

            document.head.appendChild(
              script
            );

          })();

          '''

                  reader.write_text(
                      source + loader,
                      encoding="utf-8"
                  )


          print(
              f"Related article index: {len(articles)} articles"
          )

          PY


      - name: Commit related article system
        run: |
          git config user.name "KOROPOP Related Bot"
          git config user.email "actions@github.com"

          git add \
            koropop-reader.js \
            koropop-related.js \
            koropop-articles.json

          if git diff --cached --quiet; then
            echo "Related articles already up to date."
            exit 0
          fi

          git commit -m "Auto update related articles"
          git push
