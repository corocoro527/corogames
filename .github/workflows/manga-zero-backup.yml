name: MANGA ZERO public asset backup
on:
  push:
    branches: [manga-zero-migration]
    paths:
      - 'manga-zero-migration/backup_assets.py'
      - '.github/workflows/manga-zero-backup.yml'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate episode catalog and volume chunks
        run: python3 manga-zero-migration/validate_catalog.py
      - name: Download public manga assets and verify hashes
        run: python3 manga-zero-migration/backup_assets.py
      - name: Verify complete offline package
        run: |
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('manga-zero-migration')
          report=json.loads((p/'asset-backup-report.json').read_text())
          manifest=json.loads((p/'asset-manifest.json').read_text())
          assert not report['errors'], report['errors'][:5]
          assert len(report['saved'])==report['totalUniqueReferences']==len(manifest['assets'])
          assert all((p/path).is_file() for path in manifest['assets'].values())
          import sys
          sys.path.insert(0,str(p))
          from backup_assets import references
          expected=set(references())
          assert set(manifest['assets'])==expected, 'Missing source image references'
          assert all((p/path).stat().st_size>0 for path in manifest['assets'].values())
          print(f"Verified offline package: {len(manifest['assets'])} images")
          PY
      - name: Verify SHA256 for every downloaded image
        run: python3 manga-zero-migration/verify_offline.py
      - name: Upload asset backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manga-zero-public-assets
          path: |
            manga-zero-migration/backup-assets/
            manga-zero-migration/asset-backup-report.json
            manga-zero-migration/asset-manifest.json
            manga-zero-migration/index.html
            manga-zero-migration/reader.html
            manga-zero-migration/verify_offline.py
            manga-zero-migration/backup_assets.py
            manga-zero-migration/public-catalog.json
            manga-zero-migration/episodes-*.json
            manga-zero-migration/volumes/
          if-no-files-found: warn
          retention-days: 30
