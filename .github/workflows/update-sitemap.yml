name: Auto Update Sitemap

on:
  workflow_run:
    workflows:
      - "Build Career Hub"
    types:
      - completed

  push:
    paths:
      - ".github/workflows/update-sitemap.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate sitemap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import html

          base = "https://koropopgames.com"

          exclude = {
              "index.html",
              "contact-thanks.html",
          }

          pages = sorted(
              p.name
              for p in Path(".").glob("*.html")
              if p.name not in exclude
          )

          def lastmod(filename):
              try:
                  result = subprocess.check_output(
                      [
                          "git",
                          "log",
                          "-1",
                          "--format=%cs",
                          "--",
                          filename,
                      ],
                      text=True,
                  ).strip()

                  return result or None

              except Exception:
                  return None

          urls = []

          index_date = lastmod("index.html")

          urls.append(
              (
                  base + "/",
                  index_date
              )
          )

          for filename in pages:
              urls.append(
                  (
                      f"{base}/{filename}",
                      lastmod(filename)
                  )
              )

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]

          for url, date in urls:
              lines.append("  <url>")

              lines.append(
                  f"    <loc>{html.escape(url)}</loc>"
              )

              if date:
                  lines.append(
                      f"    <lastmod>{date}</lastmod>"
                  )

              lines.append("  </url>")

          lines.append("</urlset>")

          Path("sitemap.xml").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print(
              f"Sitemap generated: {len(urls)} URLs"
          )
          PY

      - name: Commit sitemap
        run: |
          git config user.name "KOROPOP SEO Bot"
          git config user.email "actions@github.com"

          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "Sitemap already up to date."
            exit 0
          fi

          git commit -m "Auto update sitemap"
          git push
