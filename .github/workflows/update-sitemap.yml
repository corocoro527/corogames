name: Auto Update Sitemap

on:
  workflow_run:
    workflows:
      - "Build Career Hub"
    types:
      - completed

  push:
    paths:
      - ".github/workflows/update-sitemap.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate sitemap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import html

          base = "https://koropopgames.com"

          exclude = {
              "index.html",
              "contact-thanks.html",
              "love-style.html",
              "love64-v2.html",
              "love64.html",
              "love64-types.html",
              "love64-type.html",
              "love64-compat.html",
              "love64-guide.html",
              "shindan.html",
              "site-portal.html",
          }

          pages = sorted(
              p.name
              for p in Path(".").glob("*.html")
              if p.name not in exclude
          )

          # Public pages in subdirectories that should also appear in the sitemap.
          # Keep private/utility pages such as company/contact.html and
          # company/thanks.html out of the sitemap.
          extra_pages = [
              ("company/index.html", base + "/company/"),
          ]

          def lastmod(filename):
              try:
                  result = subprocess.check_output(
                      [
                          "git",
                          "log",
                          "-1",
                          "--format=%cs",
                          "--",
                          filename,
                      ],
                      text=True,
                  ).strip()

                  return result or None

              except Exception:
                  return None

          urls = []

          index_date = lastmod("index.html")

          urls.append(
              (
                  base + "/",
                  index_date
              )
          )

          for filename in pages:
              urls.append(
                  (
                      f"{base}/{filename}",
                      lastmod(filename)
                  )
              )

          for filename, url in extra_pages:
              if Path(filename).exists():
                  urls.append(
                      (
                          url,
                          lastmod(filename)
                      )
                  )

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]

          for url, date in urls:
              lines.append("  <url>")

              lines.append(
                  f"    <loc>{html.escape(url)}</loc>"
              )

              if date:
                  lines.append(
                      f"    <lastmod>{date}</lastmod>"
                  )

              lines.append("  </url>")

          lines.append("</urlset>")

          Path("sitemap.xml").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print(
              f"Sitemap generated: {len(urls)} URLs"
          )
          PY

      - name: Commit sitemap
        run: |
          git config user.name "KOROPOP SEO Bot"
          git config user.email "actions@github.com"

          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "Sitemap already up to date."
            exit 0
          fi

          git commit -m "Auto update sitemap"
          # Reconcile unrelated concurrent pushes without rewriting history.
          # Retry is bounded; conflicts fail visibly for review.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Push failed after 3 safe attempts" >&2
          exit 1

