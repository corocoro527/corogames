name: MANGA ZERO static preview package
on:
  push:
    branches: [manga-zero-migration]
    paths:
      - 'manga-zero-migration/*.html'
      - 'manga-zero-migration/*.json'
      - 'manga-zero-migration/volumes/**'
      - 'manga-zero-migration/validate_catalog.py'
      - 'manga-zero-migration/smoke_test.py'
      - '.github/workflows/manga-zero-preview.yml'
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify public catalog and reader
        run: |
          python3 manga-zero-migration/validate_catalog.py
          python3 manga-zero-migration/smoke_test.py
      - name: Assemble preview without copyrighted image files
        run: |
          mkdir -p /tmp/manga-zero-preview/volumes
          cp manga-zero-migration/index.html manga-zero-migration/reader.html /tmp/manga-zero-preview/
          cp manga-zero-migration/public-catalog.json manga-zero-migration/episodes-original.json manga-zero-migration/episodes-remaining.json /tmp/manga-zero-preview/
          cp manga-zero-migration/volumes/*.json /tmp/manga-zero-preview/volumes/
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/manga-zero-preview')
          for name in ('index.html','reader.html'):
              p=root/name
              content=p.read_text()
              needle="const preview=new URLSearchParams(location.search).get('preview')==='1';"
              assert needle in content, f'Preview guard missing in {name}'
              p.write_text(content.replace(needle,'const preview=true;'))
          PY
          if grep -q "const preview=new URLSearchParams" /tmp/manga-zero-preview/*.html; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('/tmp/manga-zero-preview').glob('*.html'):
              s=p.read_text()
              assert 'const preview=true;' in s, p
              assert 'const preview=new URLSearchParams' not in s, p
          assert not list(Path('/tmp/manga-zero-preview').rglob('backup-assets'))
          print('PASS: preview package is image-free and preview mode is forced')
          PY
          cat > /tmp/manga-zero-preview/README.txt <<'EOF'
          MANGA ZERO static preview, no bundled images.
          Serve this directory using: python3 -m http.server 8000
          Then open: http://localhost:8000/?offline=1&preview=1
          In preview mode, image placeholders are expected because this package contains no images.\n          This preview package permanently disables image loads, even without query parameters.
          This package is NOT an independent complete deployment.
          EOF
      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: manga-zero-static-preview
          path: /tmp/manga-zero-preview/
          retention-days: 30
